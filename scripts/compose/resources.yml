services:
  httpbin:
    image: kennethreitz/httpbin
    # Needed to bind to IPv6
    command: ["gunicorn", "-b", "[::]:80", "httpbin:app"]
    healthcheck:
      test: ["CMD-SHELL", "ps -C gunicorn"]
    networks:
      resources:
        ipv4_address: 10.20.0.100
        ipv6_address: 10:20:0::100

  download.httpbin: # Named after `httpbin` because that is how DNS resources are configured for the test setup.
    image: python:3.14.10-alpine3.24@sha256:a18b20ad69e74df6cf6d2e1b1a260d7a1ecf5380fd83b310f83ba88c461cf894
    command:
      - python3
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from urllib.parse import parse_qs, urlsplit

        ZEROS = bytes(64 * 1024)

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                url = urlsplit(self.path)
                if url.path != "/bytes":
                    self.send_error(404)
                    return

                num = int(parse_qs(url.query)["num"][0])
                self.send_response(200)
                self.send_header("Content-Length", str(num))
                self.end_headers()
                while num > 0:
                    num -= self.wfile.write(ZEROS[:num])

        ThreadingHTTPServer(("0.0.0.0", 80), Handler).serve_forever()
    networks:
      dns_resources:
        ipv4_address: 172.21.0.101
        aliases:
          - alias.httpbin
          - alias2.httpbin

  dns.httpbin.search.test:
    image: kennethreitz/httpbin
    healthcheck:
      test: ["CMD-SHELL", "ps -C gunicorn"]
    networks:
      dns_resources:
        ipv4_address: 172.21.0.100

  iperf3:
    image: mlabbe/iperf3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(cat /proc/net/tcp | grep 5201) && (cat /proc/net/udp | grep 5201)",
        ]
    command: -s -V
    networks:
      resources:
        ipv4_address: 10.20.0.110
        ipv6_address: 10:20:0::110
      dns_resources:
        ipv4_address: 172.21.0.110
        aliases:
          - iperf3.test

  secnetperf:
    image: ghcr.io/firezone/secnetperf:v2.6.0
    command: secnetperf -exec:maxtput -stats:1
    healthcheck:
      # 4433 (the default secnetperf port) in hex
      test: ["CMD-SHELL", "grep -q :1151 /proc/net/udp /proc/net/udp6"]
    networks:
      resources:
        ipv4_address: 10.20.0.111
        ipv6_address: 10:20:0::111

networks:
  dns_resources:
    ipam:
      config:
        - subnet: 172.21.0.0/24

  resources:
    enable_ipv6: true
    ipam:
      config:
        # Kept outside `172.16.0.0/12`: the Windows Client test routes the
        # covering CIDR resource into the tunnel while talking to a WSL2 VM,
        # which picks its NAT subnet from that range on every boot. The IPv6
        # range mirrors the IPv4 one.
        - subnet: 10.20.0.0/24
        - subnet: 10:20:0::/64
