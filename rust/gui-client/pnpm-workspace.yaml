allowBuilds:
  esbuild: true
overrides:
  "brace-expansion@<5.0.12": 5.0.12
  "minimatch@>=10 <11.0.1": 11.0.3
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
# mise's pnpm on Windows ARM is the x64 build, so it would only install x64 native bindings for the arm64 Node.
supportedArchitectures:
  os: [current]
  cpu: [current, arm64]
