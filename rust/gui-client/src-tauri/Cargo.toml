async-runtime = { workspace = true }
backoff = { workspace = true }
bin-shared = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
client-ipc = { workspace = true }
client-shared = { workspace = true }
connlib-model = { workspace = true }
derive_more = { workspace = true, features = ["debug"] }
desktop-notifications = { workspace = true }
flow-log-upload = { workspace = true }
flow-log-writer = { workspace = true }
futures = { workspace = true }
gui-ipc = { workspace = true }
hex = { workspace = true }
humantime = { workspace = true }
ip-packet = { workspace = true }
ip_network = { workspace = true }
keyring-core = { workspace = true }
known-dirs = { workspace = true }
logging = { workspace = true }
native-dialog = { workspace = true }
opentelemetry = { workspace = true }
output_vt100 = { workspace = true }
parking_lot = { workspace = true }
phoenix-channel = { workspace = true }
png = { workspace = true } # `png` is mostly free since we already need it for Tauri
rand = { workspace = true }
reqwest = { workspace = true, features = ["stream", "rustls-no-provider"] }
rustls = { workspace = true, features = ["ring"] }
sadness-generator = { workspace = true }
secrecy = { workspace = true, features = ["serde"] }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_variant = { workspace = true }
socket-factory = { workspace = true }
specta = { workspace = true, features = ["url"] }
specta-typescript = { workspace = true }
strum = { workspace = true }
subtle = { workspace = true }
tauri = { workspace = true, features = ["image-png"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-runtime = { workspace = true }
tauri-specta = { workspace = true }
tauri-utils = { workspace = true }
telemetry = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal", "time", "macros", "rt", "rt-multi-thread"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tunnel-bypass-resolver = { workspace = true }
tunnel-proto = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
windows-package-identity = { workspace = true }
x509-keystore = { workspace = true }
zip = { workspace = true, features = ["deflate", "time"] }

# Windows and macOS keep Tauri's built-in tray.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { workspace = true, features = ["tray-icon"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { workspace = true }
dirs = { workspace = true }
ksni = { workspace = true } # Tray icon for Linux.
mimalloc = { workspace = true }
nix = { workspace = true, features = ["user"] }
tracing-journald = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
admx-macro = { workspace = true }
mimalloc = { workspace = true }
windows-native-keyring-store = { workspace = true }
windows-security = { workspace = true }
windows-service = { workspace = true }
winreg = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    # `SECURITY_ATTRIBUTES`, `IsWellKnownSid` for the pipe
    "Win32_Security",
    # `GetSecurityInfo` for the pipe-owner SID check
    "Win32_Security_Authorization",
    # `WinVerifyTrust` to spot a tampered `Firezone.exe` (bad digest)
    # at launch and report a corrupt install instead of looping on the
    # package-identity restart prompt. windows-rs gates the
    # `WINTRUST_DATA` / `WINTRUST_DATA_0` types that call needs behind
    # the crypto feature, separate from `WinTrust` itself.
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    # IPC system
    "Win32_System_Pipes",
    "Win32_System_Threading",
    # `ProcessIdToSessionId` for the GUI-pipe cross-session check.
    "Win32_System_RemoteDesktop",
    # `AttachConsole` so release builds print to the terminal they were launched from.
    "Win32_System_Console",
    # `PostMessageW` to close the tray menu from off the main thread.
    "Win32_UI_WindowsAndMessaging",
    # WinRT `Windows.Foundation.Uri` and
    # `Windows.Management.Deployment.PackageManager` for the
    # `register-sparse.exe` WiX custom action.
    "Foundation",
    "Management_Deployment",
    # `Package` / `PackageId` returned by
    # `FindPackagesByPackageFamilyName`, plus `IIterable<Package>`
    # iteration to enumerate stale registrations before provisioning
    # a new external location.
    "ApplicationModel",
    "Foundation_Collections",
]

[build-dependencies]
anyhow = { workspace = true }
tauri-build = { workspace = true, features = [] }
windows-package-identity = { workspace = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = { workspace = true }

[dev-dependencies]
bin-shared = { workspace = true, features = ["test"] }
client-ipc = { workspace = true, features = ["test"] }
tempfile = { workspace = true }

[lints]
workspace = true
