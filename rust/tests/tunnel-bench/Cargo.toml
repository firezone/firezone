[package]
name = "tunnel-bench"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
anyhow = { workspace = true }
bufferpool = { workspace = true }
connlib-model = { workspace = true }
criterion = { workspace = true }
dns-types = { workspace = true }
flow-tracker = { workspace = true }
ip-packet = { workspace = true }
rand = { workspace = true }
relay-proto = { workspace = true }
serde_json = { workspace = true }
snownet = { workspace = true }
socket-factory = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
tun = { workspace = true }
tun-offload = { workspace = true }
tunnel = { workspace = true }
tunnel-proto = { workspace = true }
uuid = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
tun-apple = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tun-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
tun-windows = { workspace = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
mimalloc = { workspace = true }

[[bench]]
name = "throughput"
harness = false

[lints]
workspace = true
