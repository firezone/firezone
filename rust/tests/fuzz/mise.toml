# Keep fuzzing and source coverage on the same pinned LLVM toolchain.
[task_config]
includes = ["mise-tasks"]

[settings.cargo]
# cargo-afl builds and installs the bundled AFL++ tools alongside its binary.
binstall = false

[tools]
rust = { version = "nightly-2026-06-10", profile = "minimal", components = ["rust-src", "llvm-tools"] }
"cargo:cargo-afl" = { version = "0.18.2", os = ["linux"] }

[env]
CARGO_PROFILE_RELEASE_LTO = "false"
# Match the assertions enabled by cargo-afl in the fast replay builds too.
CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS = "true"
CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS = "true"
CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "1"
