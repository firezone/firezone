# Fuzzing runs on a dedicated nightly toolchain, pinned here via
# `RUSTUP_TOOLCHAIN` so the tasks below run plain `cargo` commands without a
# `rustup run <version>` prefix. It lives here instead of in `rust/mise.toml`
# so that it only applies to fuzzing.
#
# The toolchain is not a `rust` entry in `[tools]` because rustup-managed
# toolchains have no download URL for mise to pin in `mise.lock`, which strict
# lockfile mode requires.
#
# Every `cargo fuzz` invocation below passes `--sanitizer none`. These targets
# assert against a reference model rather than hunt for memory errors, and what
# they drive is safe Rust, so the sanitizer costs 4.6x the execution rate to
# guard nothing. Keep the flag on all of them: they share a target directory,
# and a differing sanitizer rebuilds the entire dependency graph.

[tools]
# `cargo-fuzz` tags releases without a `v` prefix. Spelling that out keeps mise
# from guessing `v0.13.2` when it looks up the release for provenance
# verification, which `provenance_api_failures_fatal` would turn into a hard
# failure.
#
# Upstream only publishes x86_64 binaries, so this does not install on arm64
# Linux.
"github:rust-fuzz/cargo-fuzz" = { version = "0.13.2", os = ["linux"], version_prefix = "" }

[env]
RUSTUP_TOOLCHAIN = "nightly-2026-06-10"
# LTO conflicts with the libFuzzer instrumentation.
CARGO_PROFILE_RELEASE_LTO = "false"

[tasks.install-toolchain]
description = "Install the pinned nightly with the components fuzzing needs"
shell = "bash -c"
# Status output goes to stderr so tasks that depend on this one can keep a
# machine-readable stdout.
run = 'rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --component llvm-tools-preview 1>&2'

[tasks.fuzz]
description = "Run a fuzz target with its target-specific defaults; extra args are passed to libFuzzer"
shell = "bash -c"
depends = [
  "install-toolchain",
  { task = "unpack-corpus", args = ["{{usage.target}}"] },
]
usage = '''
arg "<target>"
arg "[libfuzzer_args]…" var=#true
'''
raw = true
run = '''
set -euo pipefail

target="$usage_target"

if [ -n "${usage_libfuzzer_args:-}" ]; then
  # `usage` joins variadic arguments as a shell-escaped string.
  eval "set -- $usage_libfuzzer_args"
else
  set -- -max_total_time=60
fi

if [ "$target" = "tunnel-proto" ]; then
  set -- -max_len=8192 -len_control=0 "$@"
fi

./interruptible.sh cargo fuzz run --sanitizer none --target x86_64-unknown-linux-gnu --fuzz-dir . --target-dir ../../target "$target" -- "$@"
'''

[tasks.cmin]
description = "Minimize the corpus of a fuzz target"
shell = "bash -c"
depends = [
  "install-toolchain",
  { task = "unpack-corpus", args = ["{{usage.target}}"] },
]
usage = 'arg "<target>"'
raw = true
run = '''
set -euo pipefail

./interruptible.sh cargo fuzz cmin --sanitizer none --target x86_64-unknown-linux-gnu --fuzz-dir . --target-dir ../../target "$usage_target"
'''

[tasks.grow]
description = "Fuzz a target, then preserve its crashes, minimize, repack and re-baseline its corpus"
shell = "bash -c"
usage = '''
arg "<target>"
arg "[libfuzzer_args]…" var=#true
'''
raw = true
run = '''
set -euo pipefail

target="$usage_target"

if [ -n "${usage_libfuzzer_args:-}" ]; then
  # `usage` joins variadic arguments as a shell-escaped string.
  eval "set -- $usage_libfuzzer_args"
else
  # CI has the machine to itself. A developer is still using theirs during the
  # half hour this takes, so leave them a quarter of the cores.
  if [ -n "${CI:-}" ]; then
    fork="$(nproc)"
  else
    fork="$(( $(nproc) * 3 / 4 ))"
    if [ "$fork" -lt 1 ]; then
      fork=1
    fi
  fi

  # `-fork` re-merges the whole seed corpus before it discovers anything, and
  # `-max_total_time` does not bound that startup. A short budget would be
  # spent entirely inside it, so this matches what the nightly job asks for.
  set -- "-fork=$fork" -max_total_time=1800
fi

# Each step consumes what the previous one wrote, so they are invoked in order
# rather than declared as `depends`, which mise runs in parallel.
#
# A crash is the fuzzer doing its job, so a failing step does not abandon the
# ones behind it: the half hour of growth that preceded it and the input that
# provoked it are both worth keeping. Every step that can still run does, and
# the failure is re-raised once they have. The steps write through temporaries,
# so one that fails leaves the committed file it owns untouched.
failed=()

step() {
  if ! mise run "//rust/tests/fuzz:$1" "${@:2}"; then
    failed+=("$1")
  fi
}

step fuzz "$target" "$@"
step save-crashes "$target"
step cmin "$target"
step pack-corpus "$target"
step coverage "$target"
step update-baseline "$target"

if [ "${#failed[@]}" -gt 0 ]; then
  echo "error: ${#failed[@]} step(s) failed: ${failed[*]}" >&2
  exit 1
fi
'''

[tasks.save-crashes]
description = "Move a fuzz target's failing inputs into the committed crashes directory"
shell = "bash -c"
usage = 'arg "<target>"'
raw = true
run = '''
set -euo pipefail

target="$usage_target"
crashes="crashes/$target"

# `slow-unit-*` is deliberately absent: libFuzzer writes those while carrying
# on, so committing them would accumulate inputs that nothing is wrong with.
for artifact in \
  "artifacts/$target"/crash-* \
  "artifacts/$target"/timeout-* \
  "artifacts/$target"/oom-* \
  "artifacts/$target"/leak-*
do
  [ -e "$artifact" ] || continue

  name="${artifact##*/}"

  mkdir -p "$crashes"
  mv -f "$artifact" "$crashes/$name"
  chmod 0644 "$crashes/$name"
  echo "Preserved $name in $crashes"
done
'''

[tasks.update-baseline]
description = "Record the last coverage measurement as the target's committed baseline"
shell = "bash -c"
usage = 'arg "<target>"'
raw = true
run = '''
set -euo pipefail

target="$usage_target"
baseline="expected-coverage/$target.json"

before="$(cat "$baseline" 2>/dev/null || echo null)"

# Write the baseline via a temporary so a failed measurement leaves the
# committed one intact rather than truncating it.
mkdir -p expected-coverage
temporary="$(mktemp "expected-coverage/.$target.XXXXXX")"
trap 'rm -f "$temporary"' EXIT
mise run -q //rust/tests/fuzz:coverage-summary "$target" > "$temporary"
mv "$temporary" "$baseline"
chmod 0644 "$baseline"

summarise() { jq -r 'if . == null then "(none)" else "\(.total - .covered) uncovered of \(.total)" end'; }

printf 'baseline: %s -> %s\n' \
  "$(summarise <<<"$before")" \
  "$(summarise < "$baseline")"
'''

[tasks.pack-corpus]
description = "Pack a fuzz target's corpus into its deterministic archive"
shell = "bash -c"
usage = 'arg "<target>"'
raw = true
run = '''
set -euo pipefail

target="$usage_target"
corpus="corpus/$target"
archive="corpora/$target.tar.gz"

mkdir -p corpora
temporary="$(mktemp "corpora/.$target.XXXXXX")"
trap 'rm -f "$temporary"' EXIT

tar \
  --sort=name \
  --mtime=@0 \
  --owner=0 \
  --group=0 \
  --numeric-owner \
  --format=ustar \
  -cf - \
  -C "$corpus" . |
  gzip -n > "$temporary"

mv "$temporary" "$archive"
chmod 0644 "$archive"
'''

[tasks.unpack-corpus]
description = "Unpack a fuzz target's committed corpus"
shell = "bash -c"
usage = 'arg "<target>"'
raw = true
run = '''
set -euo pipefail

target="$usage_target"
archive="corpora/$target.tar.gz"
corpus="corpus/$target"

if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
  echo "error: refusing to unpack unsafe paths from $archive" >&2
  exit 1
fi

mkdir -p "$corpus"
tar -xzf "$archive" --no-same-owner --no-same-permissions -C "$corpus"
'''

[tasks.tmin]
description = "Reduce a crashing input of a fuzz target"
shell = "bash -c"
depends = ["install-toolchain"]
usage = '''
arg "<target>"
arg "<testcase>"
'''
raw = true
run = './interruptible.sh cargo fuzz tmin --sanitizer none --target x86_64-unknown-linux-gnu --fuzz-dir . --target-dir ../../target "$usage_target" "$usage_testcase"'

[tasks.repro]
description = "Replay one fuzz input with tracing; override RUST_LOG for more detail"
shell = "bash -c"
depends = ["install-toolchain"]
usage = '''
arg "<target>"
arg "<testcase>"
'''
raw = true
run = 'RUST_LOG="${RUST_LOG:-debug}" cargo fuzz run --sanitizer none --target x86_64-unknown-linux-gnu --fuzz-dir . --target-dir ../../target "$usage_target" "$usage_testcase"'

[tasks.replay-crashes]
description = "Replay a fuzz target's committed and locally produced crash artifacts with tracing"
shell = "bash -c"
depends = ["install-toolchain"]
usage = 'arg "<target>"'
raw = true
run = '''
set -euo pipefail

target="$usage_target"
bin="../../target/x86_64-unknown-linux-gnu/release/$target"
found=false

# `save-crashes` moves what it preserves, so the two directories never hold the
# same input and nothing is replayed twice.
for artifact in \
  "crashes/$target"/crash-* \
  "crashes/$target"/timeout-* \
  "crashes/$target"/oom-* \
  "crashes/$target"/leak-* \
  "artifacts/$target"/crash-* \
  "artifacts/$target"/timeout-* \
  "artifacts/$target"/oom-* \
  "artifacts/$target"/leak-* \
  "artifacts/$target"/slow-unit-*
do
  [ -e "$artifact" ] || continue

  if [ "$found" = false ]; then
    if [ ! -x "$bin" ]; then
      # A committed input is replayed from a checkout where nothing has built
      # the target yet.
      cargo fuzz build --sanitizer none --target x86_64-unknown-linux-gnu --fuzz-dir . --target-dir ../../target "$target"
    fi
    found=true
  fi

  echo "::group::Scenario for ${artifact##*/}"
  RUST_LOG="${RUST_LOG:-debug}" "$bin" "$artifact" || true
  echo "::endgroup::"
done

if [ "$found" = false ]; then
  echo "No crash artifact was written; nothing to replay."
fi
'''

[tasks.coverage]
description = "Replay the corpus of a fuzz target, producing coverage/<target>/coverage.profdata"
shell = "bash -c"
depends = [
  "install-toolchain",
  { task = "unpack-corpus", args = ["{{usage.target}}"] },
]
usage = 'arg "<target>"'
raw = true
run = '''
set -euo pipefail

cargo fuzz coverage --sanitizer none --target x86_64-unknown-linux-gnu --fuzz-dir . --target-dir ../../target "$usage_target"
'''

[tasks.coverage-report]
description = "Replay a target's corpus and generate a browsable HTML coverage report"
shell = "bash -c"
depends = [{ task = "coverage", args = ["{{usage.target}}"] }]
usage = 'arg "<target>"'
raw = true
run = '''
set -euo pipefail

target="$usage_target"
profile="coverage/$target/coverage.profdata"
binary="../../target/x86_64-unknown-linux-gnu/release/$target"
report_dir="coverage/$target/html"
llvm_cov="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-cov"

"$llvm_cov" show --format=html --output-dir="$report_dir" --instr-profile="$profile" "$binary"
echo "Coverage report: $PWD/$report_dir/index.html"
'''

[tasks.coverage-summary]
description = "Print region coverage of our own crates for a fuzz target"
shell = "bash -c"
usage = 'arg "<target>"'
raw = true
run = '''
set -euo pipefail

target="$usage_target"
profile="coverage/$target/coverage.profdata"
binary="../../target/x86_64-unknown-linux-gnu/release/$target"
llvm_cov="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-cov"

if [ ! -f "$profile" ]; then
  echo "error: coverage profile is missing; run mise run //rust/tests/fuzz:coverage $target first" >&2
  exit 1
fi

# A fuzz build instruments the dependencies too, so the profile already covers
# every workspace crate the target links. Keeping all of them means the baseline
# tracks the code we own rather than the one crate sharing the target's name.
crates="$(mise run -q //rust:workspace-crates)"

"$llvm_cov" export -instr-profile="$profile" "$binary" |
  jq -e --argjson crates "$crates" '
    [.data[].files[]
      | .filename as $file
      | select($crates | any(.dir as $dir | $file | startswith($dir)))
      | .summary.regions
    ]
    | if length == 0 then
        error("coverage profile contains no files from this workspace")
      else
        {
          covered: (map(.covered) | add),
          total: (map(.count) | add)
        }
      end
  '
'''

[tasks.coverage-check]
description = "Fail if a fuzz target exceeds its committed uncovered-region ceiling"
shell = "bash -c"
usage = 'arg "<target>"'
raw = true
run = '''
set -euo pipefail

target="$usage_target"
expected_file="expected-coverage/$target.json"
measured="$(mise run -q //rust/tests/fuzz:coverage-summary "$target")"
expected="$(<"$expected_file")"
measured_uncovered="$(jq '.total - .covered' <<<"$measured")"
expected_uncovered="$(jq '.total - .covered' <<<"$expected")"
measured_percent="$(jq '100 * .covered / .total' <<<"$measured")"
expected_percent="$(jq '100 * .covered / .total' <<<"$expected")"

printf 'measured: %s (%.2f%% covered, %d uncovered)\n' \
  "$(jq -c . <<<"$measured")" "$measured_percent" "$measured_uncovered"
printf 'expected: %s (%.2f%% covered, %d uncovered)\n' \
  "$(jq -c . <<<"$expected")" "$expected_percent" "$expected_uncovered"

if (( measured_uncovered <= expected_uncovered )); then
  exit 0
fi

echo "error: $target has $measured_uncovered uncovered regions; $expected_file allows $expected_uncovered" >&2
exit 1
'''

[tasks.lcov]
description = "Export an existing fuzz coverage profile as lcov, restricted to our own sources"
shell = "bash -c"
depends = ["install-toolchain"]
usage = 'arg "<target>"'
raw = true
run = '''
set -euo pipefail

target="$usage_target"
profile="coverage/$target/coverage.profdata"
binary="../../target/x86_64-unknown-linux-gnu/release/$target"
llvm_cov="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-cov"

if [ ! -f "$profile" ]; then
  echo "error: coverage profile is missing; run mise run //rust/tests/fuzz:coverage $target first" >&2
  exit 1
fi

# Fuzz builds instrument every dependency, including a from-source standard
# library. Their regions would otherwise dominate what we report to Coveralls.
"$llvm_cov" export \
  -format=lcov \
  -instr-profile="$profile" \
  -ignore-filename-regex="^${CARGO_HOME:-$HOME/.cargo}/" \
  -ignore-filename-regex="^${RUSTUP_HOME:-$HOME/.rustup}/" \
  "$binary"
'''

[tasks.llvm-cov]
description = "Run the nightly toolchain's llvm-cov, e.g. to post-process coverage.profdata"
shell = "bash -c"
depends = ["install-toolchain"]
usage = 'arg "<llvm_cov_args>" var=#true'
raw = true
run = '"$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-cov" $usage_llvm_cov_args'
