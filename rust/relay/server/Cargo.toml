[package]
name = "firezone-relay"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }

[features]
default = ["ebpf", "binary"]
ebpf = ["dep:aya", "dep:aya-log", "dep:ebpf-shared"]
# Everything only the `firezone-relay` binary needs. The library exposes the
# TURN server itself, e.g. for simulating a relay without portal connectivity.
binary = ["dep:bin-shared", "dep:phoenix-channel", "dep:socket-factory", "dep:telemetry"]

[[bin]]
name = "firezone-relay"
path = "src/main.rs"
required-features = ["binary"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "query"] }
backoff = { workspace = true }
base64 = { workspace = true }
bimap = { workspace = true }
bin-shared = { workspace = true, optional = true }
bytecodec = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
derive_more = { workspace = true, features = ["from"] }
eventloop-budget = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
logging = { workspace = true }
mimalloc = { workspace = true }
mio = { workspace = true, features = ["net"] }
once_cell = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics"] }
opentelemetry-otlp = { workspace = true, features = ["metrics", "grpc-tonic"] }
opentelemetry_sdk = { workspace = true }
phoenix-channel = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
rand = { workspace = true }
rustls = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
smallvec = { workspace = true }
socket-factory = { workspace = true, optional = true }
socket2 = { workspace = true }
stun_codec = { workspace = true }
telemetry = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tracing = { workspace = true, features = ["log"] }
tracing-core = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { workspace = true, optional = true }
aya-log = { workspace = true, optional = true }
ebpf-shared = { workspace = true, features = ["std"], optional = true }
mimalloc = { workspace = true, features = ["local_dynamic_tls"] } # `local_dynamic_tls` keeps the allocator's TLS model compatible with our static musl builds.

[target.'cfg(target_os = "linux")'.build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }

[dev-dependencies]
difference = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing", "metrics"] }
test-strategy = { workspace = true }
tokio = { workspace = true, features = ["process", "macros", "net"] }

[[test]]
name = "regression"
required-features = ["proptest"]

[lints]
workspace = true
