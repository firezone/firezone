[package]
name = "windows-security"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
description = "Safe Rust wrappers around the Windows security descriptor APIs."

[target.'cfg(windows)'.dependencies]
anyhow = { workspace = true }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    # `DeriveAppContainerSidFromAppContainerName` for the MSIX
    # package SID factory on `Trustee`.
    "Win32_Security_Isolation",
    # `ACCESS_ALLOWED_ACE_TYPE` and `ACCESS_DENIED_ACE_TYPE`.
    "Win32_System_SystemServices",
]

[target.'cfg(windows)'.dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
