[package]
name = "otel-metrics-export"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }

[dependencies]
anyhow = { workspace = true }
async-runtime = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-client = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["metrics", "experimental_metrics_custom_reader"] }
otel-instruments = { workspace = true }
prost = { workspace = true, features = ["std"] }
secrecy = { workspace = true }
socket-factory = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
tunnel-bypass-resolver = { workspace = true }
url = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
mach2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true
