[package]
name = "otel-azure-export"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive"] }
opentelemetry-http = { workspace = true, features = ["reqwest-blocking"] }
opentelemetry-otlp = { workspace = true, features = ["metrics", "http-proto"] }
opentelemetry_sdk = { workspace = true, features = ["metrics"] }
reqwest = { workspace = true, features = ["blocking", "query", "rustls-no-provider"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
rustls = { workspace = true }

[lints]
workspace = true
