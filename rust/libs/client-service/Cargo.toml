[package]
name = "client-service"
version = "0.1.0"
edition = { workspace = true }
authors = ["Firezone, Inc."]
license = { workspace = true }
description = "The tunnel service: runs connlib for a user session and serves the IPC socket the GUI and CLI talk to"

[dependencies]
anyhow = { workspace = true }
backoff = { workspace = true }
bin-shared = { workspace = true }
client-ipc = { workspace = true }
client-shared = { workspace = true }
connlib-model = { workspace = true }
flow-log-upload = { workspace = true }
flow-log-writer = { workspace = true }
futures = { workspace = true }
ip-packet = { workspace = true }
ip_network = { workspace = true }
known-dirs = { workspace = true }
logging = { workspace = true }
opentelemetry = { workspace = true }
output_vt100 = { workspace = true }
phoenix-channel = { workspace = true }
rand = { workspace = true }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_variant = { workspace = true }
specta = { workspace = true, features = ["url", "derive"] }
socket-factory = { workspace = true }
strum = { workspace = true }
telemetry = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal", "time", "macros", "rt", "rt-multi-thread", "fs"] }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tunnel-bypass-resolver = { workspace = true }
url = { workspace = true }
x509-keystore = { workspace = true }
zip = { workspace = true, features = ["deflate", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["user"] }
tracing-journald = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-security = { workspace = true }
windows-service = { workspace = true }
winreg = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
]

[dev-dependencies]
bin-shared = { workspace = true, features = ["test"] }
client-ipc = { workspace = true, features = ["test"] }
tempfile = { workspace = true }

[lints]
workspace = true
