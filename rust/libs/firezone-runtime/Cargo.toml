[package]
name = "firezone-runtime"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
compio = { workspace = true, features = ["polling"] }
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
compio = { workspace = true, features = ["io-uring"] }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
compio = { workspace = true, features = ["iocp-wait-packet"] }
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[lints]
workspace = true
