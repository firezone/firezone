[package]
name = "tunnel"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }

[dependencies]
anyhow = { workspace = true }
bootstrap-dns-client = { workspace = true }
bufferpool = { workspace = true }
connlib-model = { workspace = true }
dns-types = { workspace = true }
eventloop-budget = { workspace = true }
futures = { workspace = true }
futures-bounded = { workspace = true, features = ["tokio"] }
http-client = { workspace = true }
ip-packet = { workspace = true }
itertools = { workspace = true, features = ["use_std"] }
l4-tcp-dns-server = { workspace = true }
l4-udp-dns-server = { workspace = true }
logging = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics"] }
otel-instruments = { workspace = true }
rand = { workspace = true }
snownet = { workspace = true }
socket-factory = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
tun = { workspace = true }
tunnel-proto = { workspace = true, features = ["telemetry"] }

[dev-dependencies]
quinn-udp = { workspace = true }
ip-packet = { workspace = true, features = ["proptest"] }
rand = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
compio = { workspace = true, features = ["io-uring"] }
libc = { workspace = true }
packet-coalescer = { workspace = true }
socket2 = { workspace = true, features = ["all"] }

[target.'cfg(target_os = "windows")'.dependencies]
compio = { workspace = true, features = ["iocp-wait-packet"] }
packet-coalescer = { workspace = true }
wintun = "0.5.1"
telemetry = { workspace = true }
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_IO"] }
socket2 = { workspace = true, features = ["all"] }

[lints]
workspace = true
