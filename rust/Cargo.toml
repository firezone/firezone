[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
wildcard_enum_match_arm = "warn" # Ensures we match on all combinations of `Poll`, preventing erroneous suspensions.
redundant_else = "warn"
redundant_clone = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
too_many_arguments = "allow" # Don't care.
large_enum_variant = "allow" # Don't care.
type_complexity = "allow" # Don't care.

[workspace.lints.rustdoc]
private-intra-doc-links = "allow" # We don't publish any of our docs but want to catch dead links.

[patch.crates-io]
sentry = { git = "https://github.com/getsentry/sentry-rust", branch = "master" }
sentry-tracing = { git = "https://github.com/getsentry/sentry-rust", branch = "master" }
boringtun = { git = "https://github.com/firezone/boringtun", branch = "master" }
ip_network = { git = "https://github.com/JakubOnderka/ip_network", branch = "master" } # Waiting for release.
ip_network_table = { git = "https://github.com/edmonds/ip_network_table", branch = "some-useful-traits" } # For `Debug` and `Clone`
softbuffer = { git = "https://github.com/rust-windowing/softbuffer" } # Waiting for release.
quinn-udp = { git = "https://github.com/firezone/quinn", version = "0.6.0", branch = "feat/handle-partial-sendmsg-x-progress" } # Waiting for https://github.com/quinn-rs/quinn/pull/2748.
proptest = { git = "https://github.com/proptest-rs/proptest", branch = "main" } # Waiting for release.
rtnetlink = { git = "https://github.com/rust-netlink/rtnetlink", branch = "main" } # Waiting for release.

# Enforce `tracing-macros` to have released `tracing` version.
[patch.'https://github.com/tokio-rs/tracing']
tracing = "0.1.41"

[profile.release]
# Full link-time optimization. Reduces binaries by up to 3x on some platforms.
lto = "fat"

# Combined with `lto = "fat"`, this is not the usual smaller-code-for-compile-time
# trade-off: every extra codegen unit is another bitcode module the LTO step has to
# merge. Measured on `firezone-gateway` and `firezone-headless-client`, raising this
# from 1 to 16 grew peak `rustc` memory by 27-34% and the stripped binaries by ~10%,
# with no build time saved.
#
# `ebpf-turn-router` does not link at all above 1, because `handle_turn` then exceeds
# the 512-byte BPF stack limit.
codegen-units = 1

[profile.release.package.firezone-gui-client]
debug = "full"
split-debuginfo = "packed"

[profile.release.package.ebpf-turn-router]
debug = 2

# Override build settings just for the GUI client, so we get a pdb/dwp
# Cargo ignores profile settings if they're not in the workspace's Cargo.toml
[profile.dev.package.firezone-gui-client]
debug = "full"
split-debuginfo = "packed"
