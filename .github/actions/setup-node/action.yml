name: "Setup Node"
description: "Installs node and pnpm via mise and caches the pnpm store"
inputs:
  lockfile-dir:
    description: "Path to the pnpm-lock.yaml file"
    required: true
  npmjs-token:
    description: "NPMJS token to use for authentication"
    required: true
runs:
  using: "composite"
  steps:
    - name: Configure npm auth
      shell: bash
      run: |
        if [[ -z "${{ inputs.npmjs-token }}" ]]; then
          echo "inputs.npmjs-token not provided" >&2
          exit 1
        fi
        cat > "$HOME/.npmrc" <<'RC'
        always-auth=true
        //registry.npmjs.org/:_authToken=${{ inputs.npmjs-token }}
        RC
    - uses: ./.github/actions/setup-mise
      with:
        install_args: --cd ${{ inputs.lockfile-dir }} node pnpm
    # mise shims resolve versions by cwd, so put the bin dirs on PATH for steps that run elsewhere.
    - name: Add node and pnpm to PATH
      id: pnpm
      shell: bash
      working-directory: ${{ inputs.lockfile-dir }}
      run: |
        mise bin-paths node pnpm >> "$GITHUB_PATH"
        echo "store=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.lockfile-dir)) }}
