# From https://tauri.app/v1/guides/getting-started/prerequisites
name: "Setup Android"
description: "Sets up the dependencies for building our Android app"
inputs:
  sccache-azure-connection-string:
    description: "Forwarded to setup-rust-sccache"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: marocchino/tool-versions-action@4219f2e6bfdb4cce482b78f71ad9663e64f4d247 # v2.0.0
      with:
        path: kotlin/android/.tool-versions

    - uses: ./.github/actions/setup-rust-stable
      with:
        targets: armv7-linux-androideabi aarch64-linux-android x86_64-linux-android i686-linux-android

    - uses: ./.github/actions/setup-rust-sccache
      with:
        azure-connection-string: ${{ inputs.sccache-azure-connection-string }}

    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      with:
        # By default tools and platform-tools are installed, which we don't use currently
        # These consume lots of disk space
        packages: ""

    - uses: ./.github/actions/setup-mise
      with:
        install: "false"

    # Runner images may not include the pinned NDK. Use the local setup task so
    # CI installs the same version into the SDK Gradle resolves.
    - name: Install Android NDK
      run: mise run setup-ndk
      working-directory: kotlin/android
      shell: bash

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - run: touch local.properties
      shell: bash
