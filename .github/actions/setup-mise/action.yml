---
name: "Setup mise"
description: "Installs mise with a pinned version and retry logic"
inputs:
  version:
    description: "mise version to install"
    required: false
    default: "2026.7.7"
  install_args:
    description: "Arguments to pass to `mise install`"
    required: false
    default: ""
  install:
    description: "Whether to run `mise install`. Set to false to get `mise` itself without any tools, e.g. to only run a task that shells out to coreutils."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - shell: bash
      run: echo "MISE_LOCKED=1" >> "$GITHUB_ENV"
    - shell: bash
      if: ${{ runner.os == 'Windows' }}
      run: |
        echo "MISE_INSTALLS_DIR=C:\.mise-installs" >> "$GITHUB_ENV"
        echo "MISE_SCAN_PATH=C:\.mise-installs" >> "$GITHUB_ENV"
    - shell: bash
      if: ${{ runner.os != 'Windows' }}
      run: echo "MISE_SCAN_PATH=$HOME/.local/share/mise/installs" >> "$GITHUB_ENV"

    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      id: mise-1
      continue-on-error: true
      with:
        version: ${{ inputs.version }}
        install: ${{ inputs.install }}
        install_args: ${{ inputs.install_args }}
        reshim: true
        cache_key_prefix: "mise-v2"

    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      if: ${{ steps.mise-1.outcome == 'failure' }}
      id: mise-2
      continue-on-error: true
      with:
        version: ${{ inputs.version }}
        install: ${{ inputs.install }}
        install_args: ${{ inputs.install_args }}
        reshim: true
        cache_key_prefix: "mise-v2"

    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      if: ${{ steps.mise-2.outcome == 'failure' }}
      with:
        version: ${{ inputs.version }}
        install: ${{ inputs.install }}
        install_args: ${{ inputs.install_args }}
        reshim: true
        cache_key_prefix: "mise-v2"

    # Some tools (currently: firebase-tools) ship as a single self-extracting
    # binary and only materialize their bundled deps on first invocation, into
    # $HOME/.cache/firebase (hardcoded — FIREBASE_TOOLS_CACHE_PATH is ignored).
    # Pre-extract them under MISE_SCAN_PATH so trivy can see the manifests,
    # then point the default cache location at the result so subsequent
    # workflow invocations of the tool don't re-extract.
    - name: Pre-warm self-extracting tool caches
      if: ${{ runner.os != 'Windows' && inputs.install == 'true' }}
      shell: bash
      run: |
        firebase_bin=$(mise which firebase 2>/dev/null || true)
        if [[ -n "$firebase_bin" ]]; then
          cache_root="$MISE_SCAN_PATH/_firebase-home"
          mkdir -p "$cache_root" "$HOME/.cache"
          HOME="$cache_root" "$firebase_bin" --version
          ln -sfn "$cache_root/.cache/firebase" "$HOME/.cache/firebase"
        fi

    # Scan all mise-installed tools with trivy for security vulnerabilities.
    # This is a best-effort approach and has a few short-comings:
    #
    # 1. The tools themselves must either embed an SBOM (typical for `go`-based, less typical for everything else)
    #    or be installed with something that has a manifest, like `npm`.
    # 2. The tools must actually be installed via mise. We sometimes have `setup` scripts that install tools.
    #    Those are not scanned with this approach.

    - name: Scan mise installs with Trivy
      if: ${{ inputs.install == 'true' }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scan-ref: ${{ env.MISE_SCAN_PATH }}
        scanners: vuln # secrets/misconfig produce noise on bundled stdlib trees
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        format: sarif
        output: trivy-mise.sarif

    - name: Upload results to GitHub Security tab
      if: ${{ always() && inputs.install == 'true' }}
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        sarif_file: trivy-mise.sarif
        category: trivy-mise
