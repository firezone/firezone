# From https://tauri.app/v1/guides/getting-started/prerequisites
name: "Setup Tauri"
description: "Sets up the dependencies for building and testing Tauri apps"
inputs:
  runtime:
    description: "Whether to also set up runtime dependencies"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Cache apt packages
      if: ${{ runner.os == 'Linux' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: apt-cache
      with:
        path: ~/apt-cache
        key: ${{ runner.os }}-apt-tauri-${{ hashFiles('.github/actions/setup-tauri-v2/action.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-tauri-

    - name: Restore cached apt packages
      # `cache-hit` is only true on an exact key match, so this also runs for the
      # `restore-keys` fallback, where the `.deb`s are restored but the key differs.
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
      shell: bash

    - name: Install Tauri build deps
      if: ${{ runner.os == 'Linux' }}
      # `gnome-keyring` is only needed to launch the Tauri GUI, but installing it
      # here keeps the non-GUI jobs on a single apt transaction.
      uses: ./.github/actions/apt-install
      with:
        packages: build-essential curl file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev wget gnome-keyring

    - name: Install Tauri runtime deps
      if: ${{ runner.os == 'Linux' && inputs.runtime == 'true' }}
      uses: ./.github/actions/apt-install
      with:
        packages: at-spi2-core xvfb
        update: "false"

    - name: Save apt packages to cache
      if: ${{ runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true' }}
      run: |
        mkdir -p ~/apt-cache
        sudo cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
      shell: bash
    - name: Detect the WebView2 runtime
      if: ${{ runner.os == 'Windows' && inputs.runtime == 'true' }}
      id: webview2
      # The `pv` regkeys are Microsoft's documented detection method:
      # <https://learn.microsoft.com/en-us/microsoft-edge/webview2/concepts/distribution>
      # The runner images ship the runtime, so the install below is a fallback.
      run: |
        $versions = @(
          'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
          'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
        ) | ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv }
        $installed = @($versions | Where-Object { $_ -and $_ -ne '0.0.0.0' })
        Write-Host "WebView2 runtime versions found: $($installed -join ', ')"
        "installed=$(if ($installed) { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      shell: pwsh
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ runner.os == 'Windows' && inputs.runtime == 'true' && steps.webview2.outputs.installed != 'true' }}
      id: cache-webview2-installer
      with:
        path: WebView2Installer.exe
        key: webview2-offline-installer
    - name: Download the WebView2 standalone installer
      if: ${{ runner.os == 'Windows' && inputs.runtime == 'true' && steps.webview2.outputs.installed != 'true' && steps.cache-webview2-installer.outputs.cache-hit != 'true' }}
      # The "Evergreen" standalone installer from Microsoft
      # <https://developer.microsoft.com/en-us/microsoft-edge/webview2/?form=MA13LH#download>
      # It always serves the current version, so the installed version is not pinned.
      run: Invoke-WebRequest -Uri https://go.microsoft.com/fwlink/?linkid=2124701 -OutFile WebView2Installer.exe
      shell: pwsh
    - name: Install WebView2
      if: ${{ runner.os == 'Windows' && inputs.runtime == 'true' && steps.webview2.outputs.installed != 'true' }}
      run: |
        $installer = Start-Process .\WebView2Installer.exe -ArgumentList "/silent","/install" -Wait -PassThru
        if ($installer.ExitCode -ne 0) {
          throw "WebView2 installer failed with exit code $($installer.ExitCode)"
        }
      shell: pwsh
