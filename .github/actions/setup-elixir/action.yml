name: "Setup Elixir"
description: "Sets up the correct Elixir version and installs deps"
inputs:
  mix_env:
    description: "Limit deps to mix env"
    required: true
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-mise
      with:
        install_args: --cd elixir erlang elixir

    - name: Tool Versions
      id: versions
      shell: bash
      run: echo "elixir=$(mise config get -f elixir/mise.toml tools.elixir)" >> "$GITHUB_OUTPUT"

    - name: Setup Hex and Rebar
      shell: bash
      working-directory: ./elixir
      run: |
        mix local.hex --force
        mix local.rebar --force

    # Dependencies cache - keyed by mix.lock only (stable across source changes)
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Restore Elixir Deps Cache
      id: deps-cache
      with:
        path: elixir/deps
        key: v2-elixir-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.mix_env }}-${{ steps.versions.outputs.elixir }}-${{ hashFiles('elixir/mix.lock') }}

    - name: Install Dependencies
      if: ${{ steps.deps-cache.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: ./elixir
      run: mix deps.get --only ${{ inputs.mix_env }}

    # Build cache - keyed by source files for incremental compilation
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Restore Elixir Build Cache
      id: build-cache
      with:
        path: elixir/_build/${{ inputs.mix_env }}
        key: v2-elixir-build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.mix_env }}-${{ steps.versions.outputs.elixir }}-${{ hashFiles('elixir/mix.lock') }}-${{ hashFiles('elixir/lib/**/*.ex', 'elixir/config/**/*.exs', 'elixir/mix.exs') }}
        restore-keys: |
          v2-elixir-build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.mix_env }}-${{ steps.versions.outputs.elixir }}-${{ hashFiles('elixir/mix.lock') }}-

    - name: Compile Dependencies
      if: ${{ steps.deps-cache.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: ./elixir
      run: mix deps.compile --skip-umbrella-children

    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Save Elixir Deps Cache
      if: ${{ github.ref_name == 'main' && steps.deps-cache.outputs.cache-hit != 'true' }}
      with:
        path: elixir/deps
        key: ${{ steps.deps-cache.outputs.cache-primary-key }}

    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Save Elixir Build Cache
      if: ${{ github.ref_name == 'main' }}
      with:
        path: elixir/_build/${{ inputs.mix_env }}
        key: ${{ steps.build-cache.outputs.cache-primary-key }}
