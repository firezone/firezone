name: "Propose fuzz corpus"
description: "Commits a target's corpus and proposes it as a bot PR, or pushes it back to the dispatching branch"
inputs:
  target:
    description: "The fuzz target whose corpus changed"
    required: true
  branch-prefix:
    description: "The per-target branch is this prefix followed by the target"
    required: true
  title:
    description: "The commit and pull request title"
    required: true
  body:
    description: "The pull request body"
    required: true
  token:
    description: "The token that commits and opens the pull request"
    required: true
runs:
  using: "composite"
  steps:
    - name: Commit corpus update to the dispatching branch
      if: ${{ github.ref_name != github.event.repository.default_branch }}
      uses: firezone/actions/commit@f92afb7395591f2205bdcfd42b975c8dcf51bb6b # main
      with:
        token: ${{ inputs.token }}
        branch: ${{ github.ref_name }}
        message: ${{ inputs.title }}
        paths: rust/tests/fuzz/corpus/${{ inputs.target }}
    # A branch per target, so a corpus that carries a crashing input only
    # holds up its own review.
    - name: Propose corpus update
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: firezone/actions/create-pull-request@f92afb7395591f2205bdcfd42b975c8dcf51bb6b # main
      with:
        token: ${{ inputs.token }}
        branch: ${{ inputs.branch-prefix }}${{ inputs.target }}
        title: ${{ inputs.title }}
        body: ${{ inputs.body }}
        paths: rust/tests/fuzz/corpus/${{ inputs.target }}
        reviewers: firezone/engineering
