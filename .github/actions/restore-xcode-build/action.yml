---
name: "Restore the Xcode build"
description: "Restores the build products of an Xcode build, so a build whose sources have not changed recompiles almost nothing."
inputs:
  path:
    description: "DerivedData directory the build is told to use."
    required: true
  key:
    description: "Stable key prefix telling these build products apart from every other build's (e.g. platform and configuration)."
    required: true
outputs:
  key:
    description: "Key the build products were looked up under. Hand it to `save-xcode-build` rather than recomputing it."
    value: ${{ steps.key.outputs.value }}
  cache-hit:
    description: "'true' when the build products came back under the exact key, so there is nothing to save."
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: "composite"
  steps:
    # A cold DerivedData recompiles the app, its extension and both package
    # dependencies from scratch, which is the bulk of the run. The key names every
    # Swift source the build products are a function of; connlib is not among
    # them, because cargo builds it into `rust/target` on every run, sccache makes
    # that cheap, and Xcode relinks against the fresh archive and recompiles the
    # extension against the regenerated bindings because both are newer than the
    # restored products.
    - name: Compute the cache key
      id: key
      shell: bash
      # Build products are not portable across platforms, architectures or Xcode
      # versions, so the prefix the fallback stops at pins all three.
      run: |
        : "${XCODE_VERSION:?the calling job must pin the Xcode version}"

        prefix="v2-xcode-build-${{ inputs.key }}-${{ runner.arch }}-${XCODE_VERSION}-"

        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "value=${prefix}${{ hashFiles('swift/apple/**', '!swift/apple/screenshots/**') }}" >> "$GITHUB_OUTPUT"

    # The `swift` job runs because `swift/apple` changed, so the exact key mostly
    # misses and falling back to the newest build of the same platform is what a
    # pull request actually gets. A hit on the exact key means the products are
    # already a build of these very sources and there is nothing new to save.
    - name: Restore the build products
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.path }}/Build
          ${{ inputs.path }}/SourcePackages
        key: ${{ steps.key.outputs.value }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    # Xcode keys its incremental database on the dates of the sources it is about
    # to build, and a checkout dates every file by the moment it was written,
    # which would strand the database that came with the products above. A
    # constant keeps that key independent of what a pull request edited, and the
    # edit is still rebuilt because the tasks under it compare content.
    - name: Date the sources deterministically
      shell: bash
      run: find swift/apple -type f -exec touch -t 202601010000 {} +
