---
name: "Restore the Xcode build"
description: "Restores the build products of an Xcode build, so a build whose sources have not changed recompiles almost nothing."
inputs:
  path:
    description: "DerivedData directory the build is told to use."
    required: true
  key:
    description: "Stable key prefix telling these build products apart from every other build's (e.g. platform and configuration)."
    required: true
outputs:
  key:
    description: "Key the build products were looked up under. Hand it to `save-xcode-build` rather than recomputing it."
    value: ${{ steps.key.outputs.value }}
  cache-hit:
    description: "'true' when the build products came back under the exact key, so there is nothing to save."
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: "composite"
  steps:
    # A cold DerivedData recompiles the app, its extension and both package
    # dependencies from scratch, which is the bulk of the run. The key names every
    # Swift source the build products are a function of, so a hit can only ever be
    # the build of those same sources: hence no restore-keys below. connlib is not
    # among them: cargo builds it into `rust/target` on every run, sccache makes
    # that cheap, and Xcode relinks against the fresh archive and recompiles the
    # extension against the regenerated bindings because both are newer than the
    # restored products.
    - name: Compute the cache key
      id: key
      shell: bash
      # Build products are not portable across Xcode versions, so keying on an
      # unset version would serve a 26.2 build to a job asking for a 27 one.
      run: |
        : "${XCODE_VERSION:?the calling job must pin the Xcode version}"

        echo "value=v1-xcode-build-${{ inputs.key }}-${{ runner.arch }}-${XCODE_VERSION}-${{ hashFiles('swift/apple/**', '!swift/apple/screenshots/**') }}" >> "$GITHUB_OUTPUT"

    - name: Restore the build products
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/Build
        key: ${{ steps.key.outputs.value }}

    # Xcode decides what to rebuild from file timestamps, and a checkout stamps
    # every file with the moment it was written, which on its own would age out
    # the entire restored build. A constant stamps identical sources identically,
    # and the key above covers those same sources, so what the timestamps claim is
    # up to date is what the cache was written from.
    - name: Date the sources deterministically
      shell: bash
      run: find swift/apple -type f -exec touch -t 202601010000 {} +
