---
name: "Build GUI client"
description: "Sets up the toolchain the Tauri GUI client needs and builds it"
inputs:
  npmjs-token:
    description: "NPMJS token to use for authentication"
    required: true
  azure-connection-string:
    description: "Connection string for the Azure storage account backing the cache. When empty (forks, Dependabot), builds run uncached."
    required: false
    default: ""
  cargo-args:
    description: "Which part of the `firezone-gui-client` package to build"
    required: false
    default: "--all-targets"

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-node
      with:
        npmjs-token: ${{ inputs.npmjs-token }}
        lockfile-dir: ./rust/gui-client
    - uses: ./.github/actions/setup-rust-stable
    - uses: ./.github/actions/setup-rust-sccache
      with:
        azure-connection-string: ${{ inputs.azure-connection-string }}
    - uses: ./.github/actions/setup-tauri-v2
      with:
        runtime: true

    - name: Install the frontend dependencies
      shell: bash
      working-directory: ./rust/gui-client
      run: pnpm install

    - name: Build the frontend
      shell: bash
      working-directory: ./rust/gui-client
      run: pnpm vite build

    - name: Build the client
      shell: bash
      working-directory: ./rust/gui-client
      run: cargo build -p firezone-gui-client ${{ inputs.cargo-args }}
