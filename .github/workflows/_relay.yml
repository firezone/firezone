name: Build relay
run-name: Triggered from ${{ github.event_name }} by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The Git SHA to build. Leave blank to build the tip of the selected branch/tag."
        required: false
        type: string
        default: ""
      flavour:
        description: "What to build: release, debug, perf or dev. Sets the image prefix, Rust profile and image stage."
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
          - perf
          - dev
  workflow_call:
    inputs:
      flavour:
        description: "What to build: release, debug, perf or dev. Sets the image prefix, Rust profile and image stage."
        required: true
        type: string
      sha:
        required: false
        type: string
        default: ${{ github.sha }}
    outputs:
      relay_image:
        description: "The relay image that was built"
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read
  id-token: write # OIDC auth
  packages: write # push Docker images to GHCR
  security-events: write # upload Trivy SARIF results

jobs:
  binary:
    uses: ./.github/workflows/_rust-binary.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      security-events: write # trivy SARIF upload from setup-mise
    with:
      package: firezone-relay
      name: relay
      prefix: ${{ inputs.flavour != 'release' && inputs.flavour || '' }}
      sha: ${{ inputs.sha }}
      profile: ${{ (inputs.flavour == 'release' || inputs.flavour == 'perf') && 'release' || 'debug' }}
      stage: ${{ inputs.flavour == 'release' && 'release' || 'debug' }}

  image:
    needs: binary
    uses: ./.github/workflows/_rust-docker-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      package: firezone-relay
      image_name: relay
      image_prefix: ${{ inputs.flavour != 'release' && inputs.flavour || '' }}
      sha: ${{ inputs.sha }}
      stage: ${{ inputs.flavour == 'release' && 'release' || 'debug' }}
      binary_artifact: ${{ needs.binary.outputs.artifact }}
      arches: ${{ needs.binary.outputs.arches }}

  upload-binary:
    needs: binary
    if: ${{ inputs.flavour == 'release' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        arch: [x86_64, aarch64, armv7]
    env:
      RESOLVED_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.binary.outputs.artifact }}-${{ matrix.arch }}
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACTS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACTS_SUBSCRIPTION_ID }}
          # The artifacts principal holds only a data-plane role on the storage
          # account, not subscription-wide Reader.
          allow-no-subscriptions: true
      - name: Copy binary to Azure Blob Storage
        run: |
          set -e

          az storage blob upload \
            --container-name binaries \
            --name "relay/${{ env.RESOLVED_SHA }}/${{ matrix.arch }}" \
            --file firezone-relay \
            --overwrite true \
            --no-progress \
            --auth-mode login \
            --account-name firezoneartifacts

          az storage blob upload \
            --container-name binaries \
            --name "relay/${{ env.RESOLVED_SHA }}/${{ matrix.arch }}.sha256sum.txt" \
            --file firezone-relay.sha256sum.txt \
            --overwrite true \
            --no-progress \
            --auth-mode login \
            --account-name firezoneartifacts
      - name: Publish signed deployment manifest
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for suffix in .manifest.json .sigstore.json; do
            az storage blob upload \
              --container-name binaries \
              --name "relay/$RESOLVED_SHA/$ARCH$suffix" \
              --file "firezone-relay$suffix" \
              --overwrite true \
              --no-progress \
              --auth-mode login \
              --account-name firezoneartifacts
          done
