name: Compute Dependabot pnpm hash
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - rust/gui-client/package.json
      - rust/gui-client/pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: dependabot-pnpm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compute:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          diagnostic-endpoint: ""
      - name: Compute hash
        run: |
          ./scripts/nix/update-pnpm-hash.sh
          mkdir -p "$RUNNER_TEMP/pnpm-hash"
          python3 scripts/nix/dependabot-pnpm-hash.py compute "$RUNNER_TEMP/pnpm-hash/hash.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-pnpm-hash
          path: ${{ runner.temp }}/pnpm-hash/hash.json
          if-no-files-found: error
          retention-days: 1
