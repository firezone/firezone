name: Bench free-disk-space
on:
  push:
    branches: [speed-up-free-disk-space]

jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, ubuntu-latest]
        rep: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Report free space
        run: |
          read -r size used avail <<<"$(df --output=size,used,avail --block-size=1G / | tail -1)"
          echo "SAMPLE ${{ matrix.os }} rep${{ matrix.rep }} image=${ImageOS:-?} size=${size}G used=${used}G avail=${avail}G"
          test -d /mnt && echo "SAMPLE ${{ matrix.os }} rep${{ matrix.rep }} /mnt avail=$(df --output=avail --block-size=1G /mnt | tail -1)G" || echo "SAMPLE ${{ matrix.os }} rep${{ matrix.rep }} /mnt absent"
