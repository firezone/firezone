name: Bench free-disk-space
on:
  push:
    branches: [speed-up-free-disk-space]

jobs:
  old:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    steps:
      - name: Serial rm (old implementation)
        run: |
          start=$(date +%s)
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          echo "RESULT old rep${{ matrix.rep }}: $(( $(date +%s) - start ))s"

  new:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parallel unlink (new implementation, gate forced off)
        uses: ./.github/actions/free-disk-space
        with:
          required-gb: "0"
      - name: Timing
        run: echo "see step duration above"

  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Default gate (should skip on a 145 GB runner)
        uses: ./.github/actions/free-disk-space
      - name: Confirm nothing was deleted
        run: |
          df -h /
          test -d /usr/local/lib/android && echo "android intact"

  gate-keep-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: keep-android with the gate forced off
        uses: ./.github/actions/free-disk-space
        with:
          keep-android: "true"
          required-gb: "0"
      - name: Android must survive, the rest must be gone
        run: |
          test -d /usr/local/lib/android/sdk || { echo "android was deleted"; exit 1; }
          test ! -e /usr/share/dotnet || { echo "dotnet survived"; exit 1; }
          test ! -e /usr/local/.ghcup || { echo "ghcup survived"; exit 1; }
          test ! -e /opt/hostedtoolcache/CodeQL || { echo "CodeQL survived"; exit 1; }
          df -h /
