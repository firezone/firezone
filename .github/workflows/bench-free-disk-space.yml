name: Bench free-disk-space
on:
  push:
    branches: [speed-up-free-disk-space]

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Disk layout
        run: df -h
      - name: Sizes and inode counts
        run: |
          for p in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            if [[ -e "$p" ]]; then
              printf '%-40s %8s %10s inodes\n' "$p" "$(sudo du -sh "$p" | cut -f1)" "$(sudo du -s --inodes "$p" | cut -f1)"
            else
              printf '%-40s %8s\n' "$p" "MISSING"
            fi
          done
      - name: Docker images
        run: sudo docker system df

  serial:
    runs-on: ubuntu-24.04
    steps:
      - name: Current implementation
        run: |
          start=$(date +%s)
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          echo "rm: $(( $(date +%s) - start ))s"
          start=$(date +%s)
          sudo docker image prune --all --force || true
          echo "docker prune: $(( $(date +%s) - start ))s"

  par-roots:
    runs-on: ubuntu-24.04
    steps:
      - name: One rm per root, in parallel
        run: |
          start=$(date +%s)
          for p in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            sudo rm -rf "$p" &
          done
          sudo docker image prune --all --force >/dev/null 2>&1 &
          wait
          echo "total: $(( $(date +%s) - start ))s"

  par-depth:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        depth: [2, 3, 4]
        procs: [8, 32]
    steps:
      - name: Parallel unlink at depth ${{ matrix.depth }} with ${{ matrix.procs }} workers
        run: |
          roots=()
          for p in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            [[ -e "$p" ]] && roots+=("$p")
          done

          start=$(date +%s)
          sudo docker image prune --all --force >/dev/null 2>&1 &
          sudo find "${roots[@]}" -mindepth ${{ matrix.depth }} -maxdepth ${{ matrix.depth }} -print0 |
            sudo xargs -0 -r -P ${{ matrix.procs }} -n 1 rm -rf
          echo "parallel unlink: $(( $(date +%s) - start ))s"
          sudo rm -rf "${roots[@]}"
          echo "incl. mop-up: $(( $(date +%s) - start ))s"
          wait
          echo "incl. docker prune: $(( $(date +%s) - start ))s"

  verify-free:
    runs-on: ubuntu-24.04
    needs: [inventory]
    steps:
      - name: Space available on /mnt without deleting anything
        run: |
          df -h / /mnt
          echo "--- writable? ---"
          sudo mkdir -p /mnt/scratch && sudo chown "$(id -u):$(id -g)" /mnt/scratch
          dd if=/dev/zero of=/mnt/scratch/probe bs=1M count=1024 status=none && ls -lh /mnt/scratch/probe
