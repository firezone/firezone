name: Continuous Delivery
on:
  # Used for debugging the workflow by manually calling it
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Builds images that match what's default in docker-compose.yml for
  # local development.
  client-dev-images:
    uses: ./.github/workflows/_client.yml
    secrets: inherit
    permissions:
      contents: write # create/update GitHub releases
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      image_prefix: "dev"
      stage: "debug"
      profile: "debug"

  gateway-dev-images:
    uses: ./.github/workflows/_gateway.yml
    secrets: inherit
    permissions:
      contents: write # create/update GitHub releases
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      image_prefix: "dev"
      stage: "debug"
      profile: "debug"

  relay-dev-images:
    uses: ./.github/workflows/_relay.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      image_prefix: "dev"
      stage: "debug"
      profile: "debug"

  http-test-server-dev-images:
    uses: ./.github/workflows/_rust-docker-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      package: http-test-server
      image_name: http-test-server
      image_prefix: "dev"
      stage: "debug"
      profile: "debug"

  # Builds debug images with release binaries for compatibility tests in case the merge_group was skipped.
  client-test-images:
    uses: ./.github/workflows/_client.yml
    secrets: inherit
    permissions:
      contents: write # create/update GitHub releases
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      image_prefix: "debug"
      stage: "debug"
      profile: "release"

  gateway-test-images:
    uses: ./.github/workflows/_gateway.yml
    secrets: inherit
    permissions:
      contents: write # create/update GitHub releases
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      image_prefix: "debug"
      stage: "debug"
      profile: "release"

  relay-test-images:
    uses: ./.github/workflows/_relay.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      image_prefix: "debug"
      stage: "debug"
      profile: "release"

  http-test-server-test-images:
    uses: ./.github/workflows/_rust-docker-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      package: http-test-server
      image_name: http-test-server
      image_prefix: "debug"
      stage: "debug"
      profile: "release"

  # Build data-plane prod images for staging and production environments.
  client-prod-images:
    uses: ./.github/workflows/_client.yml
    secrets: inherit
    permissions:
      contents: write # create/update GitHub releases
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      profile: "release"
      stage: "release"

  gateway-prod-images:
    uses: ./.github/workflows/_gateway.yml
    secrets: inherit
    permissions:
      contents: write # create/update GitHub releases
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      profile: "release"
      stage: "release"

  relay-prod-images:
    uses: ./.github/workflows/_relay.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      profile: "release"
      stage: "release"

  http-test-server-prod-images:
    uses: ./.github/workflows/_rust-docker-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      package: http-test-server
      image_name: http-test-server
      profile: "release"
      stage: "release"

  otel-ingest-proxy-prod-images:
    uses: ./.github/workflows/_rust-docker-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      package: firezone-otel-ingest-proxy
      image_name: otel-ingest-proxy
      profile: "release"
      stage: "release"

  # Build data-plane perf images for perf-tests
  client-perf-images:
    uses: ./.github/workflows/_client.yml
    secrets: inherit
    permissions:
      contents: write # create/update GitHub releases
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      image_prefix: "perf"
      profile: "release"
      stage: "debug" # Only the debug images have perf tooling

  gateway-perf-images:
    uses: ./.github/workflows/_gateway.yml
    secrets: inherit
    permissions:
      contents: write # create/update GitHub releases
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      image_prefix: "perf"
      profile: "release"
      stage: "debug" # Only the debug images have perf tooling

  relay-perf-images:
    uses: ./.github/workflows/_relay.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      image_prefix: "perf"
      profile: "release"
      stage: "debug" # Only the debug images have perf tooling

  # Build control-plane prod images for staging and production environments.
  control-plane-images:
    uses: ./.github/workflows/_control-plane.yml
    secrets: inherit
    permissions:
      id-token: write # OIDC auth
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results

  # Build loadtest binaries for QA environment.
  loadtest-binaries:
    uses: ./.github/workflows/_loadtest.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write # OIDC auth for Azure Storage uploads

  # Builds the Nix packages and keeps the binary cache warm so PR CI and
  # release-time pushes are mostly cache hits.
  nix:
    uses: ./.github/workflows/_nix.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write # OIDC auth for the Azure binary cache upload
    with:
      push_to_cache: true

  notify:
    needs:
      [
        client-prod-images,
        gateway-prod-images,
        relay-prod-images,
        http-test-server-prod-images,
        otel-ingest-proxy-prod-images,
        control-plane-images,
        loadtest-binaries,
      ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: firezone
          repositories: infra
          permission-contents: write
      - name: Send 'checks-passed' event
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            /repos/firezone/infra/dispatches \
            --raw-field "event_type=checks-passed" \
            --field "client_payload[sha]=${{ github.sha }}"

  perf-tests:
    needs:
      [
        client-perf-images,
        gateway-perf-images,
        relay-perf-images,
        control-plane-images,
      ]
    uses: ./.github/workflows/_perf_tests.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write # OIDC auth
      checks: write # Bencher check annotations

  # To have proper test coverage, we need to run `rust` and `elixir` on `main`.

  rust:
    uses: ./.github/workflows/_rust.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write # OIDC auth
      security-events: write # trivy SARIF upload from setup-mise

  elixir:
    uses: ./.github/workflows/_elixir.yml
    secrets: inherit
    permissions:
      checks: write # dorny/test-reporter
      pull-requests: write # breaking OpenAPI changes comment

  swift:
    uses: ./.github/workflows/_swift.yml
    secrets: inherit
    permissions:
      actions: read # inspect store submission artifacts
      contents: write # release draft and build artifact uploads
      id-token: write # OIDC auth
      security-events: write # trivy SARIF upload from setup-mise

  # Gradle only writes its build cache from the default branch, so PR and merge-queue
  # runs restore nothing unless `main` is built too.
  kotlin:
    uses: ./.github/workflows/_kotlin.yml
    secrets: inherit
    permissions:
      actions: read # inspect store submission artifacts
      contents: write # release draft
      id-token: write # OIDC auth
      security-events: write # trivy SARIF upload from setup-mise

  coverage-finish:
    name: coverage-finish
    needs: [elixir, rust, swift]
    runs-on: ubuntu-24.04
    steps:
      - name: Finalize coverage upload
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          fail-on-error: false
