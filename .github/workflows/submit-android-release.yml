name: Submit Android release
run-name: Submit Android release to ${{ inputs.track }}

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track to submit for review
        required: true
        type: choice
        default: production
        options:
          - production
          - Intune (closed testing)

permissions:
  contents: read

concurrency:
  group: android-release-main
  cancel-in-progress: false

env:
  TARGET_TRACK: ${{ inputs.track == 'Intune (closed testing)' && 'Intune' || inputs.track }}
  # mark:next-android-version
  RELEASE_NAME: android-client-1.5.15

jobs:
  prepare:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub requires push access to read draft releases.
      id-token: write
      security-events: write
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      version_name: ${{ steps.release.outputs.version_name }}
    steps:
      - name: Resolve the GitHub draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view "$RELEASE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish,url)

          if [[ $(jq -r '.isDraft' <<< "$release") != true ]]; then
            echo "$RELEASE_NAME is not a draft release" >&2
            exit 1
          fi
          version_name="${RELEASE_NAME#android-client-}"

          source_sha=$(jq -r '.targetCommitish' <<< "$release")

          {
            echo "release_url=$(jq -r '.url' <<< "$release")"
            echo "source_sha=$source_sha"
            echo "version_name=$version_name"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.source_sha }}

      - name: Select submission inputs
        run: |
          # Use the submission's script and selection, with screenshot files from the build.
          git fetch --depth=1 origin "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --worktree -- scripts/upload/play-store.sh
          if [[ "$TARGET_TRACK" == production ]]; then
            git restore --source="$GITHUB_SHA" --worktree -- \
              kotlin/android/screenshots/play-store.txt \
              kotlin/android/feature-graphic.png
          fi

      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd kotlin/android github:tamtom/play-console-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/215658742954/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: play-store-publisher@firezone-55040.iam.gserviceaccount.com

      - name: Resolve the internal release
        id: play
        working-directory: kotlin/android
        env:
          GPLAY_SERVICE_ACCOUNT_JSON: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: ../../scripts/upload/play-store.sh inspect

      - name: Summarize the approval checkpoint
        env:
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION_CODE: ${{ steps.play.outputs.version_code }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: |
          {
            echo "## Android submission to $TARGET_TRACK"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            printf "| Draft | [\`%s\`](%s) |\n" "$RELEASE_NAME" "$RELEASE_URL"
            printf "| Source | [\`%s\`](https://github.com/%s/commit/%s) |\n" "$SOURCE_SHA" "$GITHUB_REPOSITORY" "$SOURCE_SHA"
            printf "| Play release | \`%s@%s\` |\n" "$VERSION_NAME" "$SOURCE_SHA"
            printf "| Version code | \`%s\` |\n" "$VERSION_CODE"
            echo "| What's New | See our full changelog at https://www.firezone.dev/changelog#tab-android. |"
            echo
            echo "### Store listing assets"
            echo
            if [[ "$TARGET_TRACK" == production ]]; then
              icon=kotlin/android/app/src/main/ic_launcher-playstore.png
              if [[ ! -s "$icon" ]]; then
                echo "Missing store icon: $icon" >&2
                exit 1
              fi
              printf -- "- [App icon](https://github.com/%s/blob/%s/%s)\n" \
                "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$icon"
              printf -- "- [Feature graphic](https://github.com/%s/blob/%s/kotlin/android/feature-graphic.png)\n" \
                "$GITHUB_REPOSITORY" "$GITHUB_SHA"
              while IFS= read -r screenshot; do
                if [[ ! -s "$screenshot" ]]; then
                  echo "Missing store screenshot: $screenshot" >&2
                  exit 1
                fi
                printf -- "- [\`%s\`](https://github.com/%s/blob/%s/%s)\n" \
                  "$screenshot" "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$screenshot"
              done < kotlin/android/screenshots/play-store.txt
              echo
              echo "The shared store listing icon, feature graphic, and screenshots will be replaced."
            else
              echo "The shared store listing is unchanged. Only the release is promoted to $TARGET_TRACK."
            fi
            echo
            echo "Review this summary and the [Play Console](https://play.google.com/console/) before approving promotion to $TARGET_TRACK. Managed Publishing still requires a manual publication after Google approves the changes."
          } >> "$GITHUB_STEP_SUMMARY"

  submit:
    if: ${{ github.ref_name == 'main' }}
    needs: prepare
    environment:
      name: google-play
      url: https://play.google.com/console/
    runs-on: ubuntu-24.04
    permissions:
      actions: read # find an existing review lock when retrying
      contents: write # Revalidating the draft also requires push access.
      id-token: write
      security-events: write
    steps:
      - name: Verify the protected environment
        env:
          GOOGLE_PLAY_CONFIGURED: ${{ vars.GOOGLE_PLAY_CONFIGURED }}
        run: |
          if [[ "$GOOGLE_PLAY_CONFIGURED" != true ]]; then
            echo "The google-play environment is not configured" >&2
            exit 1
          fi

      - name: Revalidate the GitHub draft release
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view "$RELEASE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish)

          if [[ $(jq -r '.isDraft' <<< "$release") != true ]]; then
            echo "$RELEASE_NAME is no longer a draft release" >&2
            exit 1
          fi
          if [[ $(jq -r '.targetCommitish' <<< "$release") != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "$RELEASE_NAME changed while awaiting approval; start a new workflow run" >&2
            exit 1
          fi

      # Load the locking action from this workflow's revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/create-release-review-lock
        with:
          release-name: ${{ env.RELEASE_NAME }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Select submission inputs
        run: |
          # Match the script and selection used before approval, with image files from the build.
          git fetch --depth=1 origin "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --worktree -- scripts/upload/play-store.sh
          if [[ "$TARGET_TRACK" == production ]]; then
            git restore --source="$GITHUB_SHA" --worktree -- \
              kotlin/android/screenshots/play-store.txt \
              kotlin/android/feature-graphic.png
          fi

      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd kotlin/android github:tamtom/play-console-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/215658742954/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: play-store-prod-publisher@firezone-55040.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 3600s # Outlives the bounded upload and commit step.

      - name: Submit for review
        working-directory: kotlin/android
        timeout-minutes: 30
        env:
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          GPLAY_SERVICE_ACCOUNT_JSON: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
        run: ../../scripts/upload/play-store.sh "$TARGET_TRACK"
