name: Nix
run-name: Triggered by ${{ github.actor }}
on:
  workflow_call:
    inputs:
      sha:
        description: "Commit to build. Defaults to the workflow sha."
        required: false
        type: string
      push_to_cache:
        description: "Sign and push the built closures to the binary cache"
        required: false
        type: boolean
        default: false
      systems:
        description: "JSON list of Nix systems to build"
        required: false
        type: string
        default: '["x86_64-linux", "aarch64-linux"]'
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to build. Defaults to the workflow sha."
        required: false
        type: string
      push_to_cache:
        description: "Sign and push the built closures to the binary cache"
        required: false
        type: boolean
        default: false
      systems:
        description: "JSON list of Nix systems to build"
        required: false
        type: string
        default: '["x86_64-linux", "aarch64-linux"]'

permissions:
  contents: read
  id-token: write # OIDC auth for the Azure binary cache upload

jobs:
  build:
    name: build-${{ matrix.package }}-${{ matrix.system }}
    # The nix-cache-publish environment holds NIX_CACHE_SIGNING_KEY and is
    # restricted to main and release tags; PR builds never push or sign.
    environment: ${{ inputs.push_to_cache && 'nix-cache-publish' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # An `include` with runner mappings would re-add excluded systems
        # (non-matching include entries become new combinations), so the
        # runner is derived from the system instead.
        system: ${{ fromJSON(inputs.systems) }}
        # One runner per package: each derivation compiles the whole Rust
        # dependency graph, so a shared runner leaves the three contending
        # for its cores. Runner minutes are free on public repos, wall-clock
        # time is not.
        package:
          - firezone-gateway
          - firezone-headless-client
          - firezone-gui-client
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/free-disk-space
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          diagnostic-endpoint: ""
          # Substitute from the first-party caches (kept warm by main and
          # release builds) instead of rebuilding. `nix-ci` holds the compiled
          # Cargo dependency snapshots and is only ever read here, never by
          # anyone installing Firezone from the flake.
          extra-conf: |
            extra-substituters = https://artifacts.firezone.dev/nix https://artifacts.firezone.dev/nix-ci
            extra-trusted-public-keys = artifacts.firezone.dev/nix-1:T4LHdL1HeA6LE9qgu0Po0j3RIlelKZz8pzqnzEAIRfI=
      - name: Check flake
        run: nix flake check --no-build
      - name: Build package
        run: |
          nix build \
            --out-link result-cargo-artifacts \
            .#${{ matrix.package }}.cargoArtifacts \
            --print-build-logs
          nix build .#${{ matrix.package }} --print-build-logs
      - name: Azure login (OIDC)
        if: ${{ inputs.push_to_cache }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACTS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACTS_SUBSCRIPTION_ID }}
          # The artifacts principal holds only a data-plane role on the storage
          # account, not subscription-wide Reader.
          allow-no-subscriptions: true
      - name: Sign and push to binary cache
        if: ${{ inputs.push_to_cache }}
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: ./scripts/upload/nix-cache.sh
