name: Event-loop benchmark
run-name: Triggered by ${{ github.actor }} on ${{ github.event_name }}
"on":
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/event-loop-bench.yml"
  push:
    branches:
      - main
    paths:
      - "rust/**"
      - ".github/workflows/event-loop-bench.yml"

defaults:
  run:
    working-directory: ./rust

permissions:
  contents: read

concurrency:
  group: event-loop-bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  event-loop-bench:
    name: event-loop-bench-${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      checks: write
    env:
      BENCHER_PROJECT: firezone-1l75jv1z
      BENCHER_SPEC: intel-v1
      # Bencher only measures on Linux. PRs from forks and Dependabot have no access to its API key.
      BENCHER: ${{ startsWith(matrix.runs-on, 'ubuntu') && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-stable
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      # Runs each benchmark once, so a broken one fails here instead of on Bencher.
      - name: Test bench
        run: cargo bench -p tunnel-bench --bench throughput -- --test
      - uses: bencherdev/bencher@7de3c69a85380826613050826b4bce062be2f07d # v0.6.16
        if: env.BENCHER == 'true'
      - name: Push image to the Bencher registry
        if: env.BENCHER == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          set -euo pipefail

          bench=$(
            cargo bench --no-run -p tunnel-bench --bench throughput --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "throughput") | .executable'
          )
          cp "$bench" tests/tunnel-bench/tunnel-bench
          image="registry.bencher.dev/$BENCHER_PROJECT:$GITHUB_SHA"
          docker login registry.bencher.dev -u "$BENCHER_PROJECT" --password-stdin <<<"$BENCHER_API_KEY"
          docker build --platform linux/amd64 -t "$image" tests/tunnel-bench
          docker push "$image"
          echo "IMAGE=$image" >>"$GITHUB_ENV"
      - name: Describe the measures
        if: env.BENCHER == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          set -euo pipefail

          # A project key may set units but not rename, so the name only goes into a create.
          describe() {
            bencher measure update --units "$3" "$BENCHER_PROJECT" "$1" >/dev/null ||
              bencher measure create --slug "$1" --name "$2" --units "$3" "$BENCHER_PROJECT" >/dev/null
          }
          describe throughput "Throughput" "bits/s"
          describe event-loop "Event loop CPU" "ns/packet"
          describe udp "UDP thread CPU" "ns/packet"
          describe crypto "Crypto workers CPU" "ns/packet"
          describe tun "TUN threads CPU" "ns/packet"
      - name: Run on Bencher Bare Metal
        if: env.BENCHER == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            branch=(
              --branch "$GITHUB_HEAD_REF"
              --start-point "$GITHUB_BASE_REF"
              --start-point-hash "$BASE_SHA"
              --start-point-clone-thresholds
              --start-point-reset
            )
          else
            branch=(--branch main --thresholds-reset)
            # Lower throughput and higher CPU per packet are regressions.
            for measure in throughput event-loop udp crypto tun; do
              if [ "$measure" = throughput ]; then lower=0.99; upper=_; else lower=_; upper=0.99; fi
              branch+=(
                --threshold-measure "$measure"
                --threshold-test t_test
                --threshold-max-sample-size 64
                --threshold-min-sample-size 10
                --threshold-lower-boundary "$lower"
                --threshold-upper-boundary "$upper"
              )
            done
          fi

          # Bare Metal jobs can queue for hours, so only submit the job and start its GitHub Check.
          # Once the job has run, Bencher dispatches `bencher_run` to `bencher-results.yml`, which posts the results.
          bencher run \
            --project "$BENCHER_PROJECT" \
            --testbed "bare-metal-$BENCHER_SPEC" \
            --spec "$BENCHER_SPEC" \
            --image "$IMAGE" \
            --job-timeout 300 \
            "${branch[@]}" \
            --adapter json \
            --file /tmp/tunnel-bench.json \
            --github-actions "$GH_TOKEN" \
            --ci-id event-loop \
            --detach
