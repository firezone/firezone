name: Event-loop benchmark
run-name: Triggered by ${{ github.actor }} on ${{ github.event_name }}
"on":
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/event-loop-bench.yml"
  push:
    branches:
      - main
    paths:
      - "rust/**"
      - ".github/workflows/event-loop-bench.yml"

defaults:
  run:
    working-directory: ./rust

permissions:
  contents: read

concurrency:
  group: event-loop-bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  event-loop-bench:
    name: event-loop-bench-${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    env:
      BENCHER_PROJECT: firezone-1l75jv1z
      BENCHER_SPEC: intel-v1
      # Bencher only measures on Linux. PRs from forks and Dependabot have no access to its API key.
      BENCHER: ${{ startsWith(matrix.runs-on, 'ubuntu') && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-stable
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      # Runs each benchmark once, so a broken one fails here instead of on Bencher.
      - name: Test bench
        run: cargo run --release -p tunnel-bench -- --test
      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13
        if: env.BENCHER == 'true'
      - name: Push image to the Bencher registry
        if: env.BENCHER == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          set -euo pipefail

          cp target/release/tunnel-bench tests/tunnel-bench/
          image="registry.bencher.dev/$BENCHER_PROJECT:$GITHUB_SHA"
          docker login registry.bencher.dev -u "$BENCHER_PROJECT" --password-stdin <<<"$BENCHER_API_KEY"
          docker build --platform linux/amd64 -t "$image" tests/tunnel-bench
          docker push "$image"
          echo "IMAGE=$image" >>"$GITHUB_ENV"
      - name: Describe the measures
        if: env.BENCHER == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          set -euo pipefail

          # A project key may set units but not rename, so the name only goes into a create.
          describe() {
            bencher measure update --units "$3" "$BENCHER_PROJECT" "$1" >/dev/null ||
              bencher measure create --slug "$1" --name "$2" --units "$3" "$BENCHER_PROJECT" >/dev/null
          }
          describe throughput "Throughput" "bits/s"
          describe event-loop "Event loop CPU" "ns/packet"
          describe udp "UDP thread CPU" "ns/packet"
          describe crypto "Crypto workers CPU" "ns/packet"
          describe tun "TUN threads CPU" "ns/packet"
      - name: Create the plots
        if: env.BENCHER == 'true'
        # A plot needs its benchmarks to exist, which a new benchmark only does after its first results.
        continue-on-error: true
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          set -euo pipefail

          # Plots refer to everything by UUID.
          uuid() {
            bencher "$1" view "$BENCHER_PROJECT" "$2" | jq -r .uuid
          }
          benchmark() {
            bencher benchmark list --name "$1" "$BENCHER_PROJECT" | jq -r '.[0].uuid // empty'
          }
          # Creates the plot unless one with the title exists; plots have no key of their own.
          plot() {
            local title=$1
            shift
            if [ "$(bencher plot list --title "$title" "$BENCHER_PROJECT" | jq length)" = 0 ]; then
              bencher plot create --title "$title" --x-axis version --window 7776000 \
                --branches "$(uuid branch main)" --testbeds "$(uuid testbed "bare-metal-$BENCHER_SPEC")" \
                "$@" "$BENCHER_PROJECT" >/dev/null
            fi
          }

          cpu=()
          for measure in event-loop udp crypto tun; do
            cpu+=(--measures "$(uuid measure "$measure")")
          done
          configurations=(client_outbound/cidr client_outbound/dns gateway_inbound/cidr gateway_inbound/dns
            gateway_outbound/cidr gateway_outbound/dns client_inbound/cidr client_inbound/dns)
          throughput=()
          for configuration in "${configurations[@]}"; do
            # A benchmark exists once its first results are in.
            id=$(benchmark "event_loop/$configuration")
            [ -n "$id" ] || continue
            plot "$configuration CPU per packet" --benchmarks "$id" "${cpu[@]}"
            throughput+=(--benchmarks "$id")
          done
          # One line per configuration, so only once all of them exist.
          if [ "${#throughput[@]}" = "$((2 * ${#configurations[@]}))" ]; then
            plot "Throughput" "${throughput[@]}" --measures "$(uuid measure throughput)"
          fi
      - name: Run on Bencher Bare Metal
        if: env.BENCHER == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            branch=(
              --branch "$GITHUB_HEAD_REF"
              --start-point "$GITHUB_BASE_REF"
              --start-point-hash "$BASE_SHA"
              --start-point-clone-thresholds
              --start-point-reset
            )
          else
            branch=(--branch main --thresholds-reset)
            # Lower throughput and higher CPU per packet are regressions.
            for measure in throughput event-loop udp crypto tun; do
              if [ "$measure" = throughput ]; then lower=0.99; upper=_; else lower=_; upper=0.99; fi
              branch+=(
                --threshold-measure "$measure"
                --threshold-test t_test
                --threshold-max-sample-size 64
                --threshold-min-sample-size 10
                --threshold-lower-boundary "$lower"
                --threshold-upper-boundary "$upper"
              )
            done
          fi

          # Bare Metal jobs can queue for hours, so only submit the job. Its results and
          # alerts show up on Bencher once it has run.
          bencher run \
            --project "$BENCHER_PROJECT" \
            --testbed "bare-metal-$BENCHER_SPEC" \
            --spec "$BENCHER_SPEC" \
            --image "$IMAGE" \
            --job-timeout 300 \
            "${branch[@]}" \
            --adapter json \
            --file /tmp/tunnel-bench.json \
            --detach
