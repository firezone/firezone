name: Publish release
run-name: Triggered by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Existing release name to publish"
        required: true
  release:
    types:
      - published

concurrency:
  group: "publish-production-${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  publish-docker-images:
    if: >-
      ${{
        startsWith(inputs.release_name || github.event.release.name, 'gateway') ||
        startsWith(inputs.release_name || github.event.release.name, 'headless-client')
      }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write # push promoted Docker images to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set variables
        id: set-variables
        env:
          release_name: ${{ inputs.release_name || github.event.release.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -xe

          if [[ "$release_name" =~ gateway* ]]; then
            ARTIFACT=gateway
            VERSION=${release_name#gateway-}
          elif [[ "$release_name" =~ headless* ]]; then
            ARTIFACT=client
            VERSION=${release_name#headless-client-}
          else
            echo "Shouldn't have gotten here. Exiting."
            exit 1
          fi

          MAJOR_VERSION="${VERSION%%.*}"
          MAJOR_MINOR_VERSION="${VERSION%.*}"

          sha=$(gh release view "${release_name}" --json targetCommitish -q '.targetCommitish')

          # shellcheck disable=SC2129 # individual env exports are cleaner
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_version=$MAJOR_VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor_version=$MAJOR_MINOR_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx
      - name: Pull and push
        run: |
          set -xe

          SOURCE_TAG=ghcr.io/firezone/${{ steps.set-variables.outputs.artifact }}:${{ steps.set-variables.outputs.sha }}

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=${{ steps.set-variables.outputs.sha }}" \
            -t ghcr.io/firezone/${{ steps.set-variables.outputs.artifact }}:${{ steps.set-variables.outputs.version }} \
            -t ghcr.io/firezone/${{ steps.set-variables.outputs.artifact }}:${{ steps.set-variables.outputs.version }}-${{ steps.set-variables.outputs.sha }} \
            -t ghcr.io/firezone/${{ steps.set-variables.outputs.artifact }}:${{ steps.set-variables.outputs.major_version }} \
            -t ghcr.io/firezone/${{ steps.set-variables.outputs.artifact }}:${{ steps.set-variables.outputs.major_minor_version }} \
            -t ghcr.io/firezone/${{ steps.set-variables.outputs.artifact }}:latest \
            $SOURCE_TAG

  # Builds the Nix packages at the tagged commit, signs the closures and
  # pushes them to the binary cache so users pinning the new release tag
  # substitute instead of compiling from source.
  resolve-nix-cache-sha:
    if: >-
      ${{
        startsWith(inputs.release_name || github.event.release.name, 'gateway') ||
        startsWith(inputs.release_name || github.event.release.name, 'headless-client') ||
        startsWith(inputs.release_name || github.event.release.name, 'gui-client')
      }}
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        env:
          release_name: ${{ inputs.release_name || github.event.release.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -xe

          sha=$(gh release view "$release_name" --json targetCommitish -q '.targetCommitish')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish-nix-cache:
    needs: resolve-nix-cache-sha
    uses: ./.github/workflows/_nix.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write # OIDC auth for the Azure binary cache upload
    with:
      sha: ${{ needs.resolve-nix-cache-sha.outputs.sha }}
      push_to_cache: true

  prepare-winget-manifests:
    if: >-
      ${{
        startsWith(inputs.release_name || github.event.release.name, 'gui-client') ||
        startsWith(inputs.release_name || github.event.release.name, 'headless-client')
      }}
    uses: ./.github/workflows/_winget.yml
    permissions:
      contents: read # the release's assets
    secrets:
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
    with:
      release_name: ${{ inputs.release_name || github.event.release.name }}
      release_tag: ${{ inputs.release_name || github.event.release.tag_name || github.ref_name }}

  open-version-bump-pr:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - gateway
          - gui-client
          - headless-client
          - apple-client
          - android-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Export gateway checksums
        if: ${{ startsWith(inputs.release_name || github.event.release.name, 'gateway') && matrix.component == 'gateway' }}
        env:
          GH_TOKEN: ${{ github.token }}
          release_name: ${{ inputs.release_name || github.event.release.name }}
        run: |
          set -euo pipefail

          version=${release_name#gateway-}
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          gh release download "$release_name" \
            --pattern "firezone-gateway_${version}_*.sha256sum.txt" \
            --dir "$tmpdir"

          for arch in x86_64 aarch64 armv7; do
            checksum_file="$tmpdir/firezone-gateway_${version}_${arch}.sha256sum.txt"
            checksum=$(awk '{ print $1 }' "$checksum_file")

            if [[ ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid checksum in $checksum_file: $checksum" >&2
              exit 1
            fi

            case "$arch" in
              x86_64) env_name=GATEWAY_X86_64_SHA256 ;;
              aarch64) env_name=GATEWAY_AARCH64_SHA256 ;;
              armv7) env_name=GATEWAY_ARMV7_SHA256 ;;
            esac

            echo "$env_name=$checksum" >> "$GITHUB_ENV"
          done
      - name: Bump versions
        id: bump
        if: ${{ startsWith(inputs.release_name || github.event.release.name, matrix.component) }}
        env:
          COMPONENT: ${{ matrix.component }}
          release_name: ${{ inputs.release_name || github.event.release.name }}
        run: |
          set -euo pipefail

          version=${release_name#"$COMPONENT"-}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          scripts/open-version-bump-pr.sh "$COMPONENT" "$version"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: ${{ startsWith(inputs.release_name || github.event.release.name, matrix.component) }}
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
      - uses: firezone/actions/create-pull-request@c4ae91b67c5abc541234daba15abd8cdf3087830 # main
        if: ${{ startsWith(inputs.release_name || github.event.release.name, matrix.component) }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/publish-${{ matrix.component }}-${{ steps.bump.outputs.version }}
          title: "chore: publish ${{ matrix.component }} ${{ steps.bump.outputs.version }}"
          commit-message: "chore: bump versions for ${{ matrix.component }} to ${{ steps.bump.outputs.version }}"
          paths: .
          reviewers: firezone/engineering

  # The website half of the version bump (changelog entry + displayed version
  # markers) lives in firezone/website. Notify it of the publish; its
  # open-version-bump-pr workflow runs that repo's scripts/bump-versions.sh
  # and opens the PR there.
  notify-website:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - gateway
          - gui-client
          - headless-client
          - apple-client
          - android-client
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: ${{ startsWith(inputs.release_name || github.event.release.name, matrix.component) }}
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: firezone
          repositories: website
          # repository_dispatch requires Contents: write.
          permission-contents: write
      - if: ${{ startsWith(inputs.release_name || github.event.release.name, matrix.component) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          release_name: ${{ inputs.release_name || github.event.release.name }}
        run: |
          set -xeuo pipefail

          version=${release_name#${{ matrix.component }}-}

          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            /repos/firezone/website/dispatches \
            --raw-field "event_type=publish" \
            --field "client_payload[component]=${{ matrix.component }}" \
            --field "client_payload[version]=$version"

  create-sentry-release:
    name: create_${{ matrix.component || matrix.project }}_sentry_release
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - project: gateway
          - project: gui-client
          - project: headless-client
          - project: android-client
          # The `apple-client` release ships two components, each reporting its own release name to Sentry.
          - project: apple-client
            component: macos-client
          - project: apple-client
            component: ios-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/create-sentry-release
        if: ${{ startsWith(github.event.release.name, matrix.project) }}
        with:
          project: ${{ matrix.project }}
          component: ${{ matrix.component }}
          sentry_token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  promote-deb-packages:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC auth for Azure Storage
    strategy:
      matrix:
        include:
          - tag_prefix: gateway
            deb_name: firezone-gateway
          - tag_prefix: gui-client
            deb_name: firezone-client-gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-azure-cli

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACTS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACTS_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Copy preview archive to import-stable
        if: ${{ startsWith(inputs.release_name || github.event.release.name, matrix.tag_prefix) }}
        run: |
          set -e

          # Extract version from release name
          version=${{ inputs.release_name || github.event.release.name }}
          version=${version#${{ matrix.tag_prefix }}-}

          # Copy `.deb`s to `import-stable`
          az storage blob copy start-batch \
            --destination-container apt \
            --source-container apt \
            --pattern "pool-preview/${{ matrix.deb_name }}_$version*" \
            --destination-path import-stable \
            --auth-mode login \
            --account-name firezoneartifacts

  regenerate-apt-index:
    needs: promote-deb-packages
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_apt.yml
    secrets: inherit

  # Only the GUI client ships as an `.rpm`, so unlike the `.deb` promotion this
  # is not a matrix and the whole job is skipped for other releases (which also
  # skips the dependent `regenerate-rpm-index`).
  promote-rpm-packages:
    if: ${{ startsWith(inputs.release_name || github.event.release.name, 'gui-client') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC auth for Azure Storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-azure-cli

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACTS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACTS_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Copy preview archive to import-stable
        run: |
          set -e

          # Extract version from release name
          version=${{ inputs.release_name || github.event.release.name }}
          version=${version#gui-client-}

          # Copy `.rpm`s to `import-stable`
          az storage blob copy start-batch \
            --destination-container rpm \
            --source-container rpm \
            --pattern "preview/firezone-client-gui-$version-*" \
            --destination-path import-stable \
            --auth-mode login \
            --account-name firezoneartifacts

  regenerate-rpm-index:
    needs: promote-rpm-packages
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_rpm.yml
    secrets: inherit
