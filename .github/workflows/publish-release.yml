name: Publish release
run-name: Triggered by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Existing release name to publish"
        required: true
  release:
    types:
      - published

concurrency:
  group: "publish-production-${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  publish-docker-images:
    if: >-
      ${{
        startsWith(inputs.release_name || github.event.release.name, 'gateway') ||
        startsWith(inputs.release_name || github.event.release.name, 'headless-client')
      }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write # push promoted Docker images to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set variables
        id: set-variables
        env:
          release_name: ${{ inputs.release_name || github.event.release.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -xe

          if [[ "$release_name" =~ gateway* ]]; then
            ARTIFACT=gateway
            VERSION=${release_name#gateway-}
          elif [[ "$release_name" =~ headless* ]]; then
            ARTIFACT=client
            VERSION=${release_name#headless-client-}
          else
            echo "Shouldn't have gotten here. Exiting."
            exit 1
          fi

          MAJOR_VERSION="${VERSION%%.*}"
          MAJOR_MINOR_VERSION="${VERSION%.*}"

          sha=$(gh release view "${release_name}" --json targetCommitish -q '.targetCommitish')

          # shellcheck disable=SC2129 # individual env exports are cleaner
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_version=$MAJOR_VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor_version=$MAJOR_MINOR_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx
      - name: Pull and push
        run: |
          set -xe

          SOURCE_TAG=ghcr.io/firezone/${{ steps.set-variables.outputs.artifact }}:${{ steps.set-variables.outputs.sha }}

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=${{ steps.set-variables.outputs.sha }}" \
            -t ghcr.io/firezone/${{ steps.set-variables.outputs.artifact }}:${{ steps.set-variables.outputs.version }} \
            -t ghcr.io/firezone/${{ steps.set-variables.outputs.artifact }}:${{ steps.set-variables.outputs.version }}-${{ steps.set-variables.outputs.sha }} \
            -t ghcr.io/firezone/${{ steps.set-variables.outputs.artifact }}:${{ steps.set-variables.outputs.major_version }} \
            -t ghcr.io/firezone/${{ steps.set-variables.outputs.artifact }}:${{ steps.set-variables.outputs.major_minor_version }} \
            -t ghcr.io/firezone/${{ steps.set-variables.outputs.artifact }}:latest \
            $SOURCE_TAG

  # Builds the Nix packages at the tagged commit, signs the closures and
  # pushes them to the binary cache so users pinning the new release tag
  # substitute instead of compiling from source.
  resolve-nix-cache-sha:
    if: >-
      ${{
        startsWith(inputs.release_name || github.event.release.name, 'gateway') ||
        startsWith(inputs.release_name || github.event.release.name, 'headless-client') ||
        startsWith(inputs.release_name || github.event.release.name, 'gui-client')
      }}
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        env:
          release_name: ${{ inputs.release_name || github.event.release.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -xe

          sha=$(gh release view "$release_name" --json targetCommitish -q '.targetCommitish')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish-nix-cache:
    needs: resolve-nix-cache-sha
    uses: ./.github/workflows/_nix.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write # OIDC auth for the Azure binary cache upload
    with:
      sha: ${{ needs.resolve-nix-cache-sha.outputs.sha }}
      push_to_cache: true

  # Prepares the winget manifests on a branch of the firezone/winget-pkgs fork.
  # Apps cannot open pull requests in microsoft/winget-pkgs, so the job summary
  # links to the pull request for a maintainer to open.
  prepare-winget-manifests:
    if: >-
      ${{
        startsWith(inputs.release_name || github.event.release.name, 'gui-client') ||
        startsWith(inputs.release_name || github.event.release.name, 'headless-client')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read # the release's assets
    env:
      KOMAC_VERSION: 2.17.1
      KOMAC_SHA256: e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7
    steps:
      - id: package
        env:
          release_name: ${{ inputs.release_name || github.event.release.name }}
        run: |
          set -euo pipefail

          if [[ "$release_name" == gui-client-* ]]; then
            identifier=Firezone.Client.GUI
            version=${release_name#gui-client-}
          else
            identifier=Firezone.Client.Headless
            version=${release_name#headless-client-}
          fi
          {
            echo "identifier=$identifier"
            echo "version=$version"
            echo "branch=$identifier-$version"
          } >> "$GITHUB_OUTPUT"
      - name: Generate the manifests
        id: manifests
        env:
          # komac only reads: the release, and the package's manifests in microsoft/winget-pkgs.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          IDENTIFIER: ${{ steps.package.outputs.identifier }}
          VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ inputs.release_name || github.event.release.tag_name || github.ref_name }}
          NO_COLOR: "1"
        run: |
          set -euo pipefail

          curl -fsSL -o "$RUNNER_TEMP/komac.tar.gz" \
            "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$KOMAC_SHA256  $RUNNER_TEMP/komac.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/komac.tar.gz" -C "$RUNNER_TEMP" komac

          mapfile -t urls < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | select(.name | test("\\.(exe|msi|msix|appx)(bundle)?$")) | .browser_download_url')

          # komac only writes the manifests to disk on its way to submitting them, so
          # take them from what a dry run prints instead.
          "$RUNNER_TEMP/komac" update "$IDENTIFIER" --version "$VERSION" --urls "${urls[@]}" \
            --release-notes-url https://www.firezone.dev/changelog --dry-run > "$RUNNER_TEMP/komac.out"

          git init -q .
          python3 - "$RUNNER_TEMP/komac.out" "$IDENTIFIER" "$VERSION" <<'PYTHON'
          import os, re, sys

          output, identifier, version = sys.argv[1:]
          data = open(output, "rb").read()
          directory = os.path.join("manifests", identifier[0].lower(), *identifier.split("."), version)
          os.makedirs(directory)

          starts = [m.start() for m in re.finditer(rb"^# Created with ", data, re.M)]
          for start, end in zip(starts, starts[1:] + [len(data)]):
              # komac prints a newline after each manifest, whose own lines end in CRLF.
              manifest = data[start:end]
              assert manifest.endswith(b"\r\n\n"), manifest
              manifest = manifest[:-1]
              kind = re.search(rb"^ManifestType: (\S+)", manifest, re.M).group(1).decode()
              if kind == "version":
                  name = f"{identifier}.yaml"
              elif kind == "installer":
                  name = f"{identifier}.installer.yaml"
              else:
                  locale = re.search(rb"^PackageLocale: (\S+)", manifest, re.M).group(1).decode()
                  name = f"{identifier}.locale.{locale}.yaml"
              with open(os.path.join(directory, name), "xb") as f:
                  f.write(manifest)

          assert len(starts) >= 3, data
          PYTHON

          # The pull request title komac would give it.
          latest=$(sed -n "s/^Latest version of $IDENTIFIER: //p" "$RUNNER_TEMP/komac.out")
          if [ "$latest" = "$VERSION" ]; then
            state="Update version"
          elif [ "$(printf '%s\n' "$latest" "$VERSION" | sort -V | tail -n1)" = "$VERSION" ]; then
            state="New version"
          else
            state="Add version"
          fi
          echo "title=$state: $IDENTIFIER version $VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: firezone
          repositories: winget-pkgs
          permission-contents: write
          # Syncing the fork is refused when upstream changed its workflows.
          permission-workflows: write
      - name: Sync firezone/winget-pkgs with upstream
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! response=$(gh api -X POST repos/firezone/winget-pkgs/merge-upstream -f branch=master 2>&1); then
            echo "::error::Could not sync firezone/winget-pkgs with microsoft/winget-pkgs: $response"
            exit 1
          fi
          echo "$response"
      - uses: firezone/actions/commit@c4ae91b67c5abc541234daba15abd8cdf3087830 # main
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: firezone/winget-pkgs
          branch: ${{ steps.package.outputs.branch }}
          base: master
          message: ${{ steps.manifests.outputs.title }}
          paths: manifests
      - name: Link to the pull request
        env:
          BRANCH: ${{ steps.package.outputs.branch }}
          TITLE: ${{ steps.manifests.outputs.title }}
        run: |
          set -euo pipefail

          url="https://github.com/microsoft/winget-pkgs/compare/master...firezone:winget-pkgs:$BRANCH?expand=1&title=$(jq -rn --arg title "$TITLE" '$title | @uri')"
          echo "Open the winget pull request for $TITLE: $url" >> "$GITHUB_STEP_SUMMARY"

  open-version-bump-pr:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - gateway
          - gui-client
          - headless-client
          - apple-client
          - android-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Export gateway checksums
        if: ${{ startsWith(inputs.release_name || github.event.release.name, 'gateway') && matrix.component == 'gateway' }}
        env:
          GH_TOKEN: ${{ github.token }}
          release_name: ${{ inputs.release_name || github.event.release.name }}
        run: |
          set -euo pipefail

          version=${release_name#gateway-}
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          gh release download "$release_name" \
            --pattern "firezone-gateway_${version}_*.sha256sum.txt" \
            --dir "$tmpdir"

          for arch in x86_64 aarch64 armv7; do
            checksum_file="$tmpdir/firezone-gateway_${version}_${arch}.sha256sum.txt"
            checksum=$(awk '{ print $1 }' "$checksum_file")

            if [[ ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid checksum in $checksum_file: $checksum" >&2
              exit 1
            fi

            case "$arch" in
              x86_64) env_name=GATEWAY_X86_64_SHA256 ;;
              aarch64) env_name=GATEWAY_AARCH64_SHA256 ;;
              armv7) env_name=GATEWAY_ARMV7_SHA256 ;;
            esac

            echo "$env_name=$checksum" >> "$GITHUB_ENV"
          done
      - name: Bump versions
        id: bump
        if: ${{ startsWith(inputs.release_name || github.event.release.name, matrix.component) }}
        env:
          COMPONENT: ${{ matrix.component }}
          release_name: ${{ inputs.release_name || github.event.release.name }}
        run: |
          set -euo pipefail

          version=${release_name#"$COMPONENT"-}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          scripts/open-version-bump-pr.sh "$COMPONENT" "$version"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: ${{ startsWith(inputs.release_name || github.event.release.name, matrix.component) }}
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
      - uses: firezone/actions/create-pull-request@c4ae91b67c5abc541234daba15abd8cdf3087830 # main
        if: ${{ startsWith(inputs.release_name || github.event.release.name, matrix.component) }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/publish-${{ matrix.component }}-${{ steps.bump.outputs.version }}
          title: "chore: publish ${{ matrix.component }} ${{ steps.bump.outputs.version }}"
          commit-message: "chore: bump versions for ${{ matrix.component }} to ${{ steps.bump.outputs.version }}"
          paths: .
          reviewers: firezone/engineering

  # The website half of the version bump (changelog entry + displayed version
  # markers) lives in firezone/website. Notify it of the publish; its
  # open-version-bump-pr workflow runs that repo's scripts/bump-versions.sh
  # and opens the PR there.
  notify-website:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - gateway
          - gui-client
          - headless-client
          - apple-client
          - android-client
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: ${{ startsWith(inputs.release_name || github.event.release.name, matrix.component) }}
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: firezone
          repositories: website
          # repository_dispatch requires Contents: write.
          permission-contents: write
      - if: ${{ startsWith(inputs.release_name || github.event.release.name, matrix.component) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          release_name: ${{ inputs.release_name || github.event.release.name }}
        run: |
          set -xeuo pipefail

          version=${release_name#${{ matrix.component }}-}

          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            /repos/firezone/website/dispatches \
            --raw-field "event_type=publish" \
            --field "client_payload[component]=${{ matrix.component }}" \
            --field "client_payload[version]=$version"

  create-sentry-release:
    name: create_${{ matrix.component || matrix.project }}_sentry_release
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - project: gateway
          - project: gui-client
          - project: headless-client
          - project: android-client
          # The `apple-client` release ships two components, each reporting its own release name to Sentry.
          - project: apple-client
            component: macos-client
          - project: apple-client
            component: ios-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/create-sentry-release
        if: ${{ startsWith(github.event.release.name, matrix.project) }}
        with:
          project: ${{ matrix.project }}
          component: ${{ matrix.component }}
          sentry_token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  promote-deb-packages:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC auth for Azure Storage
    strategy:
      matrix:
        include:
          - tag_prefix: gateway
            deb_name: firezone-gateway
          - tag_prefix: gui-client
            deb_name: firezone-client-gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-azure-cli

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACTS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACTS_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Copy preview archive to import-stable
        if: ${{ startsWith(inputs.release_name || github.event.release.name, matrix.tag_prefix) }}
        run: |
          set -e

          # Extract version from release name
          version=${{ inputs.release_name || github.event.release.name }}
          version=${version#${{ matrix.tag_prefix }}-}

          # Copy `.deb`s to `import-stable`
          az storage blob copy start-batch \
            --destination-container apt \
            --source-container apt \
            --pattern "pool-preview/${{ matrix.deb_name }}_$version*" \
            --destination-path import-stable \
            --auth-mode login \
            --account-name firezoneartifacts

  regenerate-apt-index:
    needs: promote-deb-packages
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_apt.yml
    secrets: inherit

  # Only the GUI client ships as an `.rpm`, so unlike the `.deb` promotion this
  # is not a matrix and the whole job is skipped for other releases (which also
  # skips the dependent `regenerate-rpm-index`).
  promote-rpm-packages:
    if: ${{ startsWith(inputs.release_name || github.event.release.name, 'gui-client') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC auth for Azure Storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-azure-cli

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACTS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACTS_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Copy preview archive to import-stable
        run: |
          set -e

          # Extract version from release name
          version=${{ inputs.release_name || github.event.release.name }}
          version=${version#gui-client-}

          # Copy `.rpm`s to `import-stable`
          az storage blob copy start-batch \
            --destination-container rpm \
            --source-container rpm \
            --pattern "preview/firezone-client-gui-$version-*" \
            --destination-path import-stable \
            --auth-mode login \
            --account-name firezoneartifacts

  regenerate-rpm-index:
    needs: promote-rpm-packages
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_rpm.yml
    secrets: inherit
