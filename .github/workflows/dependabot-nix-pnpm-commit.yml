name: Commit Dependabot pnpm hash
on:
  workflow_run:
    workflows: [Compute Dependabot pnpm hash]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-pnpm-commit-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  commit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      vars.NIX_HASH_APP_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only trusted workflow source is checked out; PR contents are API data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate and commit hash
        env:
          GH_TOKEN: ${{ github.token }}
          NIX_HASH_APP_ID: ${{ vars.NIX_HASH_APP_ID }}
          NIX_HASH_APP_PRIVATE_KEY: ${{ secrets.NIX_HASH_APP_PRIVATE_KEY }}
        run: python3 scripts/nix/dependabot-pnpm-hash.py commit
