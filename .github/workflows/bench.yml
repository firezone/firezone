name: Benchmarks
run-name: Triggered from ${{ github.event_name }} by ${{ github.actor }}
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bench.yml"
      - "rust/.cargo/**"
      - "rust/Cargo.lock"
      - "rust/Cargo.toml"
      - "rust/libs/**"
      - "rust/rust-toolchain.toml"
      - "scripts/bencher/**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".github/workflows/bench.yml"
      - "rust/.cargo/**"
      - "rust/Cargo.lock"
      - "rust/Cargo.toml"
      - "rust/libs/**"
      - "rust/rust-toolchain.toml"
      - "scripts/bencher/**"

concurrency:
  group: "bench-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BENCHER_PROJECT: firezone-1l75jv1z
  BENCHER_SPEC: intel-v1

jobs:
  per-packet:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    # Bencher runs one Bare Metal job at a time, so a run may queue behind others.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write # post Bencher PR comments
      checks: write # Bencher check annotations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-stable
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13
      - name: Build bench
        working-directory: rust
        run: |
          set -euo pipefail

          exe=$(cargo bench -p tunnel --bench per_packet --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "per_packet" and .executable != null) | .executable')
          cp "$exe" ../scripts/bencher/per_packet
      - name: Push image to the Bencher registry
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          set -euo pipefail

          image="registry.bencher.dev/$BENCHER_PROJECT:$GITHUB_SHA"
          # The registry takes the subject of the API key as username.
          user=$(tr '_-' '/+' <<<"$BENCHER_API_KEY" | jq -Rr 'split(".")[1] | @base64d | fromjson | .sub')
          docker login registry.bencher.dev -u "$user" --password-stdin <<<"$BENCHER_API_KEY"
          docker build --platform linux/amd64 -t "$image" scripts/bencher
          docker push "$image"
          echo "IMAGE=$image" >>"$GITHUB_ENV"
      - name: Run on Bencher Bare Metal
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            branch=(
              --branch "$GITHUB_HEAD_REF"
              --start-point "$GITHUB_BASE_REF"
              --start-point-hash "$BASE_SHA"
              --start-point-clone-thresholds
              --start-point-reset
            )
          else
            branch=(
              --branch main
              --threshold-measure latency
              --threshold-test t_test
              --threshold-max-sample-size 64
              --threshold-upper-boundary 0.99
              --thresholds-reset
            )
          fi

          bencher run \
            --project "$BENCHER_PROJECT" \
            --testbed "bare-metal-$BENCHER_SPEC" \
            --spec "$BENCHER_SPEC" \
            --image "$IMAGE" \
            --job-timeout 300 \
            "${branch[@]}" \
            --adapter json \
            --file /tmp/bmf.json \
            --github-actions "$GITHUB_TOKEN" \
            --ci-id per-packet \
            --error-on-alert \
            --exec /usr/local/bin/per-packet.sh

  archive:
    if: github.event.action == 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13
      - name: Archive the PR's Bencher branch
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: bencher archive --project "$BENCHER_PROJECT" --branch "$GITHUB_HEAD_REF"
