---
name: Bencher Bare Metal trial
"on":
  push:
    branches:
      - bencher-bare-metal-trial
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BENCHER_PROJECT: firezone-1l75jv1z
  BENCHER_BRANCH: bencher-bare-metal-trial
  RUNS: 5

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC auth
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-stable
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      - name: Build bench binary
        working-directory: rust
        run: |
          set -euo pipefail
          exe=$(cargo bench -p tunnel --bench per_packet --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "per_packet" and .executable != null) | .executable')
          mkdir -p ../image
          cp "$exe" ../image/per_packet
      - name: Write image files
        run: |
          cat > image/run-bench <<'EOF'
          #!/bin/bash
          # Usage: run-bench <group> [divan args...]
          set -euo pipefail
          ip link set lo up 2>/dev/null || true
          echo 16777216 > /proc/sys/net/core/rmem_max || true
          echo 16777216 > /proc/sys/net/core/wmem_max || true
          group="$1"
          shift
          /usr/local/bin/per_packet --bench "$@" "$group" | tee /tmp/divan.txt
          python3 -X utf8 /usr/local/bin/divan2bmf < /tmp/divan.txt > /tmp/bmf.json
          EOF
          cat > image/divan2bmf <<'EOF'
          import json, re, sys

          UNITS = {"ps": 1e-3, "ns": 1.0, "µs": 1e3, "us": 1e3, "ms": 1e6, "s": 1e9}
          TIME = re.compile(r"^([0-9.]+) (ps|ns|µs|us|ms|s)$")
          NAME = re.compile(r"^((?:│  |   )*)(?:├─ |╰─ )(\S+)\s*(.*)$")

          def ns(cell):
              m = TIME.match(cell.strip())
              return float(m.group(1)) * UNITS[m.group(2)] if m else None

          seps = None
          path = []
          out = {}
          for line in sys.stdin:
              line = line.rstrip("\n")
              if "fastest" in line and "│ slowest" in line:
                  seps = [i for i, c in enumerate(line) if c == "│"]
                  path = []
                  continue
              if seps is None or len(line) <= seps[-1]:
                  continue
              bounds = [0] + seps + [len(line)]
              cols = [line[a:b].lstrip("│") for a, b in zip(bounds, bounds[1:])]
              m = NAME.match(cols[0])
              if not m:
                  continue
              depth = len(m.group(1)) // 3
              path = path[:depth] + [m.group(2)]
              fastest = ns(m.group(3))
              median = ns(cols[2])
              if fastest is None or median is None:
                  continue
              out["::".join(path)] = {
                  "latency": {"value": median, "lower_value": fastest, "upper_value": ns(cols[1])}
              }
          json.dump(out, sys.stdout, indent=1)
          EOF
          cat > image/Dockerfile <<'EOF'
          FROM ubuntu:24.04
          RUN apt-get update \
            && apt-get install -y --no-install-recommends iproute2 python3 \
            && rm -rf /var/lib/apt/lists/*
          COPY per_packet run-bench /usr/local/bin/
          COPY divan2bmf /usr/local/bin/divan2bmf
          RUN chmod +x /usr/local/bin/per_packet /usr/local/bin/run-bench
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-context
          path: image
          retention-days: 7
      - name: Build and push image
        id: push
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$BENCHER_API_KEY" in
            bencher_run_*) user="$BENCHER_PROJECT" ;;
            bencher_user_*) echo "::error::user API keys need the owner's email as username"; exit 1 ;;
            *)
              payload=$(cut -d. -f2 <<< "$BENCHER_API_KEY" | tr '_-' '/+')
              while (( ${#payload} % 4 )); do payload+="="; done
              user=$(base64 -d <<< "$payload" | jq -r .sub)
              ;;
          esac
          image="registry.bencher.dev/$BENCHER_PROJECT:$TAG"
          docker build --platform linux/amd64 -t "$image" image
          docker image ls "$image"
          docker login registry.bencher.dev -u "$user" --password-stdin <<< "$BENCHER_API_KEY"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  bare-metal:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13
      - name: Run on Bencher Bare Metal
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set +e -uo pipefail
          mkdir -p out
          for i in $(seq 1 "$RUNS"); do
            for group in state event_loop; do
              start=$(date +%s)
              bencher run \
                --project "$BENCHER_PROJECT" \
                --branch "$BENCHER_BRANCH" \
                --testbed bare-metal-trial-intel-v1 \
                --spec intel-v1 \
                --image "$IMAGE" \
                --job-timeout 300 \
                --job-poll-interval 10 \
                --adapter json \
                --file /tmp/bmf.json \
                --exec /usr/local/bin/run-bench "$group" \
                > "out/$group-$i.log" 2>&1
              status=$?
              echo "$group run $i: exit $status after $(( $(date +%s) - start ))s"
              tail -n 5 "out/$group-$i.log"
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bare-metal
          path: out

  github-runner:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-context
          path: image
      - name: Run on GitHub runner
        run: |
          set +e -uo pipefail
          chmod +x image/per_packet
          sudo sysctl -w net.core.rmem_max=16777216 net.core.wmem_max=16777216
          nproc
          mkdir -p out
          for i in $(seq 1 "$RUNS"); do
            for group in state event_loop; do
              start=$(date +%s)
              ./image/per_packet --bench "$group" > "out/$group-$i.log" 2>&1
              echo "$group run $i: exit $? after $(( $(date +%s) - start ))s"
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: github-runner
          path: out
