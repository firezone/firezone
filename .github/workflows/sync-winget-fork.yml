# Keeps `master` of the fork firezone/winget-pkgs an exact fast-forward
# mirror of microsoft/winget-pkgs by calling the same `merge-upstream` API
# as the "Sync fork" button every five minutes. A continuously fresh fork
# means `komac sync-fork` during client releases never has anything
# non-trivial to do, so releases stop failing on a stale fork.
#
# This lives here rather than in the fork so the fork's `master` carries no
# Firezone-specific commits: any commit of our own there would force every
# sync to create a merge commit instead of fast-forwarding.
#
# `SYNC_TOKEN` is a fine-grained PAT (resource owner: firezone, repository
# access: only firezone/winget-pkgs, permissions: Contents and Workflows
# read-write). The Workflows permission lets the sync move `master` across
# upstream commits that touch `.github/workflows/*`, which `WINGET_TOKEN`
# cannot (see the notes in publish-release.yml).
name: Sync winget-pkgs fork

on:
  schedule:
    - cron: "2-57/5 * * * *" # every 5 minutes, offset to avoid the congested top of the hour
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-winget-fork

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge microsoft/winget-pkgs into firezone/winget-pkgs
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: gh api --method POST repos/firezone/winget-pkgs/merge-upstream -f branch=master
