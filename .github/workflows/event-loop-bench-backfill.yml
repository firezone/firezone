name: Event-loop benchmark backfill
run-name: Backfill triggered by ${{ github.actor }}
"on":
  pull_request:
    paths:
      - .github/workflows/event-loop-bench-backfill.yml
      - rust/tests/tunnel-bench/backfill/**

defaults:
  run:
    working-directory: ./rust

permissions:
  contents: read

jobs:
  commits:
    name: commits
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        working-directory: .
        run: echo "list=$(jq -R -s -c 'split("\n") | map(select(length > 0))' rust/tests/tunnel-bench/backfill/commits.txt)" >>"$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.commit }}
    runs-on: ubuntu-24.04
    needs: commits
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.commits.outputs.list) }}
    env:
      BENCHER_PROJECT: firezone-1l75jv1z
      COMMIT: ${{ matrix.commit }}
      BACKFILL: backfill/rust/tests/tunnel-bench/backfill
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: backfill
          sparse-checkout: rust/tests/tunnel-bench/backfill
      # The commit's own actions, so its toolchain file is the one that gets installed.
      - uses: ./.github/actions/setup-rust-stable
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      - name: Build the commit's tunnel-bench
        run: cargo build --release -p tunnel-bench
      - name: Push image to the Bencher registry
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          set -euo pipefail

          cp target/release/tunnel-bench "$GITHUB_WORKSPACE/$BACKFILL/"
          image="registry.bencher.dev/$BENCHER_PROJECT:$COMMIT-backfill"
          docker login registry.bencher.dev -u "$BENCHER_PROJECT" --password-stdin <<<"$BENCHER_API_KEY"
          docker build --platform linux/amd64 -t "$image" "$GITHUB_WORKSPACE/$BACKFILL"
          docker push "$image"
          mkdir -p "$GITHUB_WORKSPACE/built" && touch "$GITHUB_WORKSPACE/built/$COMMIT"
      # Marks the commit as built for the submit job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-${{ matrix.commit }}
          path: built

  submit:
    name: submit
    needs: [commits, build]
    # A commit whose build failed is skipped below; the rest are still submitted.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BENCHER_PROJECT: firezone-1l75jv1z
      BENCHER_SPEC: intel-v1
      COMMITS: ${{ needs.commits.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: built-*
          path: built
          merge-multiple: true
      - name: Submit to Bencher Bare Metal in order
        working-directory: .
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          set -euo pipefail

          # In their order on main: Bencher numbers a branch's versions as the reports are
          # created, which happens at submission. The backdate puts each report at its
          # commit's time on the date axis.
          for commit in $(jq -r '.[]' <<<"$COMMITS"); do
            if [ ! -f "built/$commit" ]; then
              echo "No image for $commit, its build failed"
              continue
            fi
            bencher run \
              --project "$BENCHER_PROJECT" \
              --branch main \
              --hash "$commit" \
              --backdate "$(git show -s --format=%ct "$commit")" \
              --testbed "bare-metal-$BENCHER_SPEC" \
              --spec "$BENCHER_SPEC" \
              --image "registry.bencher.dev/$BENCHER_PROJECT:$commit-backfill" \
              --job-timeout 300 \
              --adapter json \
              --file /tmp/tunnel-bench.json \
              --detach
          done
