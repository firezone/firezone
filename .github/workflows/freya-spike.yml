name: Freya spike
on:
  push:
    branches: [freya-gui-spike]
    paths:
      - rust/gui-client-freya-spike/**
      - .github/workflows/freya-spike.yml

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust/gui-client-freya-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust/gui-client-freya-spike
      - run: cargo test --locked -- --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: rust/gui-client-freya-spike/screenshots/
