name: Build and upload loadtest binaries
run-name: Triggered from ${{ github.event_name }} by ${{ github.actor }}

on:
  workflow_call:
    inputs:
      sha:
        required: false
        type: string
        default: ${{ github.sha }}
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC auth for Azure Storage uploads

jobs:
  loadtest:
    name: loadtest-${{ matrix.os }}-${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: firezone-loadtest
            artifact_name: x86_64
          - os: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: firezone-loadtest.exe
            artifact_name: x86_64.exe
          - os: macos
            runner: macos-26
            target: aarch64-apple-darwin
            binary: firezone-loadtest
            artifact_name: aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - uses: ./.github/actions/setup-rust-binary-cache
        id: binary-cache
        with:
          path: rust/target/${{ matrix.target }}/release/${{ matrix.binary }}
          key: firezone-loadtest-${{ matrix.target }}-release

      # A restored binary skips the build below, so the toolchain that only
      # exists to compile it is skipped too.
      - uses: ./.github/actions/setup-rust-stable
        if: steps.binary-cache.outputs.cache-hit != 'true'
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-rust-sccache
        if: steps.binary-cache.outputs.cache-hit != 'true'
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux' && steps.binary-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/apt-install
        with:
          packages: musl-tools

      - name: Install Azure CLI (macOS)
        if: matrix.os == 'macos'
        run: brew update && brew install azure-cli

      - name: Register Event Log source (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-EventLog -LogName Application -Source "FirezoneLoadtest" -ErrorAction SilentlyContinue
          Write-Host "Event Log source 'FirezoneLoadtest' registered (or already exists)"

      - name: Build loadtest binary
        if: steps.binary-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          cargo build \
            --profile release \
            --target ${{ matrix.target }} \
            --package firezone-loadtest

      - name: Package binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.binary }}

      - name: Generate checksum (Linux/Windows)
        if: matrix.os != 'macos'
        shell: bash
        run: sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256sum.txt

      - name: Generate checksum (macOS)
        if: matrix.os == 'macos'
        run: shasum -a 256 ${{ matrix.binary }} > ${{ matrix.binary }}.sha256sum.txt

      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firezone-loadtest-${{ matrix.os }}-${{ matrix.artifact_name }}
          path: |
            rust/${{ matrix.binary }}
            rust/${{ matrix.binary }}.sha256sum.txt

      - name: Azure login (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_QA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_QA_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_QA_SUBSCRIPTION_ID }}
          # The QA principal only holds a data-plane role on the storage account,
          # not subscription-wide Reader, so don't fail on subscription enumeration.
          allow-no-subscriptions: true

      - name: Upload to QA artifacts storage
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -e
          az storage blob upload \
            --account-name firezoneqaartifacts \
            --auth-mode login \
            --container-name binaries \
            --name "loadtest/${{ matrix.os }}/${{ inputs.sha }}/${{ matrix.artifact_name }}" \
            --file "${{ matrix.binary }}" \
            --overwrite true \
            --no-progress

          az storage blob upload \
            --account-name firezoneqaartifacts \
            --auth-mode login \
            --container-name binaries \
            --name "loadtest/${{ matrix.os }}/${{ inputs.sha }}/${{ matrix.artifact_name }}.sha256sum.txt" \
            --file "${{ matrix.binary }}.sha256sum.txt" \
            --overwrite true \
            --no-progress
