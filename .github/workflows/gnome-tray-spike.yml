name: GNOME tray screenshot spike
on:
  workflow_dispatch:
    inputs:
      client-run-id:
        description: Reuse the debug client artifact from an earlier spike run
        type: string
        default: ""

permissions:
  contents: read

env:
  TSLINK_BUILD: true
  FIREZONE_NO_TELEMETRY: "true"

jobs:
  build:
    if: inputs.client-run-id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
        with:
          npmjs-token: ${{ secrets.NPMJS_TOKEN }}
          lockfile-dir: ./rust/gui-client
      - uses: ./.github/actions/setup-rust-stable
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      - uses: ./.github/actions/setup-tauri-v2
      - name: Build debug client with mock Tunnel service
        working-directory: rust/gui-client
        run: |
          pnpm install --frozen-lockfile
          pnpm vite build
          cargo build -p firezone-gui-client --bin firezone-gui-client --features tauri/custom-protocol
          strip --strip-debug ../target/debug/firezone-gui-client
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnome-tray-client
          path: rust/target/debug/firezone-gui-client
          if-no-files-found: error

  capture:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.client-run-id != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gnome-tray-client
          path: client
          github-token: ${{ github.token }}
          run-id: ${{ inputs.client-run-id || github.run_id }}
      - uses: ./.github/actions/apt-install
        with:
          packages: gnome-shell gnome-shell-extension-appindicator yaru-theme-gnome-shell fonts-cantarell libgl1-mesa-dri libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libxdo3 gnome-keyring python3-gi python3-pil
      - name: Photograph the native GNOME menu
        timeout-minutes: 5
        run: |
          chmod +x client/firezone-gui-client
          mkdir -p captures
          dpkg-query -W gnome-shell gnome-shell-extension-appindicator yaru-theme-gnome-shell fonts-cantarell libgl1-mesa-dri > captures/packages.txt
          dbus-run-session -- /usr/bin/python3 scripts/tests/gnome-tray-screenshot.py client/firezone-gui-client captures
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gnome-tray-capture-${{ matrix.attempt }}
          path: captures
          if-no-files-found: error

  compare:
    needs: capture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gnome-tray-capture-*
          path: captures
      - uses: ./.github/actions/apt-install
        with:
          packages: python3-pil
      - name: Compare pixels across fresh runners and repeated captures
        run: /usr/bin/python3 scripts/tests/gnome-tray-screenshot.py --compare captures
