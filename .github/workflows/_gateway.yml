name: Build gateway
run-name: Triggered from ${{ github.event_name }} by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The Git SHA to build. Leave blank to build the tip of the selected branch/tag."
        required: false
        type: string
        default: ""
      flavour:
        description: "What to build: release, debug, perf or dev. Sets the image prefix, Rust profile and image stage."
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
          - perf
          - dev
  workflow_call:
    inputs:
      flavour:
        description: "What to build: release, debug, perf or dev. Sets the image prefix, Rust profile and image stage."
        required: true
        type: string
      sha:
        required: false
        type: string
        default: ${{ github.sha }}
    outputs:
      gateway_image:
        description: "The gateway image that was built"
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: write # create/update GitHub releases
  id-token: write # OIDC auth
  packages: write # push Docker images to GHCR
  security-events: write # upload Trivy SARIF results

jobs:
  update-release-draft:
    runs-on: ubuntu-24.04
    env:
      RESOLVED_SHA: ${{ inputs.sha || github.sha }}
      # mark:next-gateway-version
      RELEASE_NAME: gateway-1.6.6
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        if: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' }}"
        id: update-release-draft
        with:
          config-name: release-drafter-gateway.yml
          tag: ${{ env.RELEASE_NAME }}
          version: ${{ env.RELEASE_NAME }}
          name: ${{ env.RELEASE_NAME }}
          commitish: ${{ env.RESOLVED_SHA }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binary:
    needs: update-release-draft
    uses: ./.github/workflows/_rust-binary.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      security-events: write # trivy SARIF upload from setup-mise
    with:
      package: firezone-gateway
      name: gateway
      prefix: ${{ inputs.flavour != 'release' && inputs.flavour || '' }}
      sha: ${{ inputs.sha }}
      profile: ${{ (inputs.flavour == 'release' || inputs.flavour == 'perf') && 'release' || 'debug' }}
      stage: ${{ inputs.flavour == 'release' && 'release' || 'debug' }}

  image:
    needs: binary
    uses: ./.github/workflows/_rust-docker-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write # push Docker images to GHCR
      security-events: write # upload Trivy SARIF results
    with:
      package: firezone-gateway
      image_name: gateway
      image_prefix: ${{ inputs.flavour != 'release' && inputs.flavour || '' }}
      sha: ${{ inputs.sha }}
      stage: ${{ inputs.flavour == 'release' && 'release' || 'debug' }}
      binary_artifact: ${{ needs.binary.outputs.artifact }}
      arches: ${{ needs.binary.outputs.arches }}

  # Only a dispatched build packages the `.deb`. On a push, it would just
  # expire unread as an artifact.
  package:
    needs: binary
    if: ${{ inputs.flavour == 'release' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        arch: [x86_64, aarch64, armv7]
    env:
      # mark:next-gateway-version
      BINARY_DEST_PATH: firezone-gateway_1.6.6_${{ matrix.arch }}
      RESOLVED_SHA: ${{ inputs.sha || github.sha }}
      TARGET: ${{ fromJSON('{"x86_64":"x86_64-unknown-linux-musl","aarch64":"aarch64-unknown-linux-musl","armv7":"armv7-unknown-linux-musleabihf"}')[matrix.arch] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RESOLVED_SHA }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.binary.outputs.artifact }}-${{ matrix.arch }}
          path: rust
      - uses: ./.github/actions/setup-rust-stable
        with:
          targets: ${{ env.TARGET }}
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd rust
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package binary
        run: cp firezone-gateway "$BINARY_DEST_PATH"
      - if: ${{ github.ref_name == 'main' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACTS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACTS_SUBSCRIPTION_ID }}
          # The artifacts principal holds only a data-plane role on the storage
          # account, not subscription-wide Reader.
          allow-no-subscriptions: true
      - name: Create Firezone Gateway .deb package
        run: |
          mkdir -p target/${{ env.TARGET }}/release
          cp firezone-gateway target/${{ env.TARGET }}/release/firezone-gateway
          cargo deb --package firezone-gateway --target ${{ env.TARGET }} --no-build --no-strip
          cp target/debian/*.deb "$BINARY_DEST_PATH".deb
      - name: Upload Release Assets
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # mark:next-gateway-version
          RELEASE_NAME: gateway-1.6.6
          ARTIFACT_PATH: ${{ env.BINARY_DEST_PATH }}
        run: |
          set -xe

          ../scripts/upload/github-release.sh

          az storage blob upload-batch \
            --destination apt \
            --source . \
            --pattern "*.deb" \
            --destination-path import-preview \
            --overwrite \
            --no-progress \
            --auth-mode login \
            --account-name firezoneartifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BINARY_DEST_PATH }}.deb
          path: rust/${{ env.BINARY_DEST_PATH }}.deb
          retention-days: 1

  regenerate-apt-index:
    needs: package
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' }}
    uses: ./.github/workflows/_apt.yml
    secrets: inherit
