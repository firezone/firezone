name: Build otel-ingest-proxy
run-name: Triggered from ${{ github.event_name }} by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The Git SHA to build. Leave blank to build the tip of the selected branch/tag."
        required: false
        type: string
        default: ""
      flavour:
        description: "What to build: release, debug, perf or dev. Sets the artifact prefix and Rust profile."
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
          - perf
          - dev
  workflow_call:
    inputs:
      flavour:
        description: "What to build: release, debug, perf or dev. Sets the artifact prefix and Rust profile."
        required: true
        type: string
      sha:
        required: false
        type: string
        default: ${{ github.sha }}

permissions:
  contents: read
  id-token: write # OIDC auth

jobs:
  binary:
    uses: ./.github/workflows/_rust-binary.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      package: firezone-otel-ingest-proxy
      name: otel-ingest-proxy
      prefix: ${{ inputs.flavour != 'release' && inputs.flavour || '' }}
      sha: ${{ inputs.sha }}
      profile: ${{ (inputs.flavour == 'release' || inputs.flavour == 'perf') && 'release' || 'debug' }}
      stage: ${{ inputs.flavour == 'release' && 'release' || 'debug' }}

  upload-binary:
    needs: binary
    if: ${{ inputs.flavour == 'release' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        arch: [x86_64, aarch64, armv7]
    env:
      RESOLVED_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.binary.outputs.artifact }}-${{ matrix.arch }}
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACTS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACTS_SUBSCRIPTION_ID }}
          # The artifacts principal holds only a data-plane role on the storage
          # account, not subscription-wide Reader.
          allow-no-subscriptions: true
      - name: Copy binary to Azure Blob Storage
        run: |
          set -e

          az storage blob upload \
            --container-name binaries \
            --name "otel-ingest-proxy/${{ env.RESOLVED_SHA }}/${{ matrix.arch }}" \
            --file firezone-otel-ingest-proxy \
            --overwrite true \
            --no-progress \
            --auth-mode login \
            --account-name firezoneartifacts

          az storage blob upload \
            --container-name binaries \
            --name "otel-ingest-proxy/${{ env.RESOLVED_SHA }}/${{ matrix.arch }}.sha256sum.txt" \
            --file firezone-otel-ingest-proxy.sha256sum.txt \
            --overwrite true \
            --no-progress \
            --auth-mode login \
            --account-name firezoneartifacts
      - name: Publish signed deployment manifest
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for suffix in .manifest.json .sigstore.json; do
            az storage blob upload \
              --container-name binaries \
              --name "otel-ingest-proxy/$RESOLVED_SHA/$ARCH$suffix" \
              --file "firezone-otel-ingest-proxy$suffix" \
              --overwrite true \
              --no-progress \
              --auth-mode login \
              --account-name firezoneartifacts
          done
