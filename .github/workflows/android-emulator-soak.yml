name: Android emulator soak

# The instrumented suite fails intermittently, which a normal CI run is a poor instrument for:
# it rebuilds everything to reach one sample, and takes twenty minutes to do it. This takes the
# APKs a run has already built and puts them through the emulator as many times as asked, at once.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The CI run whose debug APK to reuse. Its `build-debug` must have finished.
        required: true
      attempts:
        description: How many times to run the suite, each on an emulator of its own.
        default: "8"
      suite:
        description: Which suite to run.
        type: choice
        options: [unmanaged, managed]
        default: unmanaged

permissions:
  contents: "read"
  actions: "read" # Reading an artifact of another run

env:
  FIREZONE_NO_TELEMETRY: "true"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      attempts: ${{ steps.plan.outputs.attempts }}
      script: ${{ steps.plan.outputs.script }}
    steps:
      # A matrix cannot be a count, so turn the count into the list of samples it stands for.
      - id: plan
        run: |
          set -euo pipefail
          count='${{ inputs.attempts }}'

          if ! [ "$count" -ge 1 ] 2>/dev/null || [ "$count" -gt 30 ]; then
            echo "error: attempts must be between 1 and 30, got '${count}'" >&2
            exit 1
          fi

          echo "attempts=$(seq 1 "$count" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

          tests='./kotlin/android/mise-tasks/emulator-tests.sh'

          if [ '${{ inputs.suite }}' = managed ]; then
            echo "script=./kotlin/android/mise-tasks/managed-device/provision.sh && ${tests} --annotation dev.firezone.android.RequiresManagedDevice" >> "$GITHUB_OUTPUT"
          else
            echo "script=${tests} --notAnnotation dev.firezone.android.RequiresManagedDevice" >> "$GITHUB_OUTPUT"
          fi

  soak:
    needs: plan
    runs-on: ubuntu-24.04
    # One sample failing is the result, not a reason to stop taking the others.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attempt: ${{ fromJSON(needs.plan.outputs.attempts) }}
    name: soak (${{ matrix.attempt }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk-space
        with:
          keep-android: "true"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Android debug APK
          path: kotlin/android
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The runner ships /dev/kvm but leaves it readable only by root.
      - name: Grant access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 5
          target: default
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
            -no-snapshot-save -no-snapshot-load
          # `script` is not a `run:` step, so it starts at the repository root.
          script: ${{ needs.plan.outputs.script }}
