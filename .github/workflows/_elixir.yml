name: Elixir
on:
  workflow_call:

jobs:
  unit-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./elixir
    permissions:
      checks: write # dorny/test-reporter
      pull-requests: write # breaking OpenAPI changes comment
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2.3
      - uses: ./.github/actions/setup-postgres
      - uses: ./.github/actions/setup-elixir
        with:
          mix_env: ${{ env.MIX_ENV }}

      - name: Compile Application
        run: mix compile --warnings-as-errors

      - name: Setup Database
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Run Tests with Coverage
        env:
          E2E_DEFAULT_WAIT_SECONDS: 20
          CI_ASSERT_RECEIVE_TIMEOUT_MS: 250
        run: mix coveralls.lcov

      - name: Test Report
        if: github.event.pull_request.head.repo.full_name == github.repository && (success() || failure())
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Elixir Unit Test Report
          path: elixir/_build/test/lib/*/test-junit-report.xml
          reporter: java-junit

      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: elixir/cover/lcov.info
          format: lcov
          flag-name: portal
          parallel: true
          fail-on-error: false

  type-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./elixir
    env:
      # We need to set MIX_ENV to dev to make sure that we won't type-check our test helpers
      MIX_ENV: dev
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2.3
      - uses: ./.github/actions/setup-elixir
        id: setup-beam
        with:
          mix_env: ${{ env.MIX_ENV }}

      - name: Compile Application
        run: mix compile --warnings-as-errors

      - name: Create PLTs
        run: mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer --format dialyxir

  static-analysis:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./elixir
    env:
      MIX_ENV: test
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    services:
      swagger-validator:
        image: swaggerapi/swagger-validator-v2:latest
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2.3
      - uses: ./.github/actions/setup-elixir
        with:
          mix_env: ${{ env.MIX_ENV }}

      - name: Compile Application
        run: mix compile --force --warnings-as-errors

      - name: Check Formatting
        run: mix format --check-formatted

      - name: Check For Retired Packages
        run: mix hex.audit

      - name: Check For Vulnerable Packages
        run: mix deps.audit

      - name: Run Sobelow vulnerability scanner
        working-directory: ./elixir
        run: mix sobelow --skip --exit

      - name: Run Credo
        run: mix credo --strict

      - name: Check for unused deps
        run: mix deps.unlock --check-unused

      - name: Validate OpenAPI spec
        env:
          OBAN_ENABLED: "false"
        run: |
          mix openapi.spec.json --spec PortalAPI.ApiSpec --pretty=true --vendor-extensions=false \
            --filename priv/static/openapi.json --check=true
          mix openapi.spec.yaml --spec PortalAPI.ApiSpec
          result=$(curl --fail --show-error --silent \
            --max-time 10 \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            --retry-all-errors \
            --data-binary @openapi.yaml \
            -H 'Content-Type:application/yaml' \
            http://localhost:8080/validator/debug)
          echo "$result"
          echo "$result" | jq -e '.schemaValidationMessages | length == 0'

      # Reports breaking changes to the published API in the job summary. It
      # does not fail the job: there is no API versioning strategy yet, so a
      # breaking change is a review decision rather than a build error.
      - name: Fetch base OpenAPI spec
        if: github.base_ref != ''
        run: git show "origin/${{ github.base_ref }}:elixir/priv/static/openapi.json" > ../base-openapi.json
      - name: Check for breaking OpenAPI changes
        id: oasdiff
        if: github.base_ref != ''
        uses: oasdiff/oasdiff-action/breaking@45c956ed8138f7f18f0425d34e3d66730b805cb2 # v0.1.9
        with:
          base: base-openapi.json
          revision: elixir/priv/static/openapi.json
          # Keep the spec in CI: no upload to oasdiff.com and no PR comment.
          review: "false"
          github-token: ""
      # One comment per PR, updated on every run, so a breaking change is seen
      # in the review rather than buried in a job summary.
      - name: Comment on breaking OpenAPI changes
        if: github.base_ref != '' && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BREAKING: ${{ steps.oasdiff.outputs.breaking }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- openapi-breaking-changes -->"
          if [[ -n "$BREAKING" ]]; then
            body=$(printf '%s\n## :warning: Breaking OpenAPI changes\n\nThis PR changes the REST API in a way that can break generated clients:\n\n```\n%s\n```\n' "$marker" "$BREAKING")
          else
            body=$(printf '%s\n## Breaking OpenAPI changes\n\nNone on the latest run.\n' "$marker")
          fi
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" >/dev/null
          elif [[ -n "$BREAKING" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
