name: Build macOS/iOS app
on:
  workflow_call:
  workflow_dispatch:

jobs:
  update-release-draft:
    name: update-release-draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write # release-drafter needs to create/update releases
    env:
      # mark:next-apple-version
      RELEASE_NAME: apple-client-1.5.20
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        if: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' }}"
        id: update-release-draft
        with:
          config-name: release-drafter-apple-client.yml
          tag: ${{ env.RELEASE_NAME}}
          version: ${{ env.RELEASE_NAME}}
          name: ${{ env.RELEASE_NAME}}
          commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: macos-26
    permissions:
      security-events: write # trivy SARIF upload from setup-mise
    env:
      XCODE_VERSION: "26.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch "$(find /Applications -maxdepth 1 -name "Xcode*${XCODE_VERSION}*.app" | sort -V | tail -n 1)"
      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd swift/apple swiftlint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run //swift/apple:test-coverage
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        env:
          # The macOS runner installs the reporter from the coverallsapp/coveralls
          # Homebrew tap, which Homebrew 6.0.0 refuses to load unless trusted.
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: swift/apple/FirezoneKit/coverage.lcov
          flag-name: swift-test
          parallel: true
          fail-on-error: false

  # Photographs the real app so a UI change lands in the diff of the pull request
  # that causes it: builds the macOS app, launches it against the mocked backend
  # (`--mock-tunnel`, one scenario and appearance per launch; see MockTunnel.swift)
  # through the FirezoneUITests bundle, and hands the captures to
  # commit-screenshots. The images are not compared against references.
  macos-screenshots:
    runs-on: macos-26
    env:
      XCODE_VERSION: "26.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch "$(find /Applications -maxdepth 1 -name "Xcode*${XCODE_VERSION}*.app" | sort -V | tail -n 1)"
      # The app target embeds the system extension, whose build phase compiles
      # connlib for the host architecture.
      - uses: ./.github/actions/setup-rust-stable
        with:
          targets: aarch64-apple-darwin
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      # Ad-hoc signing with the entitlements dropped: the runner has no signing
      # certificate, and the mocked app touches none of the facilities the
      # entitlements gate. Restricted entitlements without a provisioning profile
      # would keep the app from launching.
      #
      # GIT_SHA is left unset on purpose. The settings screens print it as their
      # build string, so passing the commit would change two of the images on
      # every commit; without it the app falls back to the fixed "unknown".
      - name: Build the app screenshot UI tests
        working-directory: swift/apple
        run: |
          xcodebuild build-for-testing \
            -project Firezone.xcodeproj \
            -scheme FirezoneUITests \
            -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS= \
            ENABLE_APP_SANDBOX=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            ONLY_ACTIVE_ARCH=YES
      # Vibrancy and window chrome do not rasterise identically from one runner
      # to the next, which reaches the gallery as a diff no one can see. Drawing
      # them opaque takes that source of noise out of the captures.
      - name: Draw materials opaque
        run: defaults write com.apple.universalaccess reduceTransparency -bool true
      - name: Run the app screenshot UI tests
        working-directory: swift/apple
        run: |
          xcodebuild test-without-building \
            -project Firezone.xcodeproj \
            -scheme FirezoneUITests \
            -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            -resultBundlePath "${RUNNER_TEMP}/FirezoneUITests.xcresult"
      - name: Export the screenshots from the result bundle
        run: |
          swift/apple/mise-tasks/export-screenshots.sh \
            "${RUNNER_TEMP}/FirezoneUITests.xcresult" \
            swift/apple/screenshots/macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-screenshots
          path: swift/apple/screenshots/macos
      # The result bundle holds XCUITest's own failure screenshots and logs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: macos-screenshots-xcresult
          path: ${{ runner.temp }}/FirezoneUITests.xcresult

  # The iOS half of the gallery. The app target builds for the simulator, where
  # a Network Extension cannot run at all, so the mocked backend is what makes
  # the screens reachable there.
  #
  # A simulator's appearance belongs to the device rather than to a launch, so
  # the suite runs once per appearance with `simctl ui` in between, rather than
  # switching appearance per launch the way the macOS lane does.
  ios-screenshots:
    runs-on: macos-26
    env:
      XCODE_VERSION: "26.2"
      # Pinned to the Xcode above rather than resolved as "latest": a runner
      # image that adds a runtime would otherwise redraw the whole gallery.
      SIMULATOR_NAME: iPhone 17
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch "$(find /Applications -maxdepth 1 -name "Xcode*${XCODE_VERSION}*.app" | sort -V | tail -n 1)"
      # The app target embeds the network extension, whose build phase compiles
      # connlib for the simulator.
      - uses: ./.github/actions/setup-rust-stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      - name: Boot the simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r \
            --arg name "${SIMULATOR_NAME}" --arg runtime "${SIMULATOR_RUNTIME}" \
            '.devices[$runtime] // [] | map(select(.name == $name)) | first | .udid // empty')

          if [ -z "${udid}" ]; then
            echo "No ${SIMULATOR_NAME} on ${SIMULATOR_RUNTIME}; the runner has:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi

          xcrun simctl boot "${udid}"
          xcrun simctl bootstatus "${udid}"

          # The captures include the status bar, whose clock and battery would
          # otherwise differ on every run.
          xcrun simctl status_bar "${udid}" override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100

          # Materials behind the sheet toolbars do not rasterise identically
          # from one run to the next, which reaches the gallery as a diff no one
          # can see. Drawing them opaque takes that source of noise out of the
          # captures. Each test launches the app afresh, so the setting is read
          # at launch.
          xcrun simctl spawn "${udid}" defaults write \
            com.apple.Accessibility ReduceTransparencyEnabled -bool true

          echo "SIMULATOR_UDID=${udid}" >> "${GITHUB_ENV}"
      # Signing is skipped outright: the simulator asks for none, and the
      # entitlements would need a provisioning profile the runner has not got.
      #
      # GIT_SHA is left unset on purpose. The settings screens print it as their
      # build string, so passing the commit would change two of the images on
      # every commit; without it the app falls back to the fixed "unknown".
      - name: Build the app screenshot UI tests
        working-directory: swift/apple
        run: |
          xcodebuild build-for-testing \
            -project Firezone.xcodeproj \
            -scheme FirezoneUITests \
            -configuration Debug \
            -destination "id=${SIMULATOR_UDID}" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            ONLY_ACTIVE_ARCH=YES
      - name: Photograph the iOS screens
        working-directory: swift/apple
        run: |
          for appearance in light dark; do
            xcrun simctl ui "${SIMULATOR_UDID}" appearance "${appearance}"

            # xcodebuild forwards TEST_RUNNER_-prefixed variables to the test
            # runner process with the prefix stripped.
            TEST_RUNNER_SCREENSHOT_APPEARANCE="${appearance}" \
              xcodebuild test-without-building \
                -project Firezone.xcodeproj \
                -scheme FirezoneUITests \
                -configuration Debug \
                -destination "id=${SIMULATOR_UDID}" \
                -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
                -resultBundlePath "${RUNNER_TEMP}/FirezoneUITests-${appearance}.xcresult"

            mise-tasks/export-screenshots.sh \
              "${RUNNER_TEMP}/FirezoneUITests-${appearance}.xcresult" \
              screenshots/ios
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-screenshots
          path: swift/apple/screenshots/ios
      # The result bundles hold XCUITest's own failure screenshots and logs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ios-screenshots-xcresult
          path: ${{ runner.temp }}/FirezoneUITests-*.xcresult

  static-analysis:
    runs-on: macos-26
    permissions:
      security-events: write # trivy SARIF upload from setup-mise
    env:
      XCODE_VERSION: "26.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch "$(find /Applications -maxdepth 1 -name "Xcode*${XCODE_VERSION}*.app" | sort -V | tail -n 1)"
      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd swift/apple swiftlint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Swift formatting and linting
        run: mise run //swift/apple:check

  build:
    name: ${{ matrix.job_name }}
    # Skip builds on CD (push to main) - only needed for PR validation and releases
    if: github.event_name != 'push'
    needs: update-release-draft
    runs-on: macos-26
    env:
      XCODE_VERSION: "26.2"
    permissions:
      contents: write # for attaching the build artifacts to the release
      id-token: write # OIDC auth
      security-events: write # trivy SARIF upload from setup-mise
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        include:
          - job_name: build-ios
            rust-targets: aarch64-apple-ios
            build-script: scripts/build/ios-appstore.sh
            upload-script: scripts/upload/app-store-connect.sh
            # mark:next-apple-version
            artifact-file: "firezone-ios-client-1.5.20.ipa"
            platform: iOS
            # mark:next-apple-version
            release-name: apple-client-1.5.20

          - job_name: build-macos-appstore
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            build-script: scripts/build/macos-appstore.sh
            upload-script: scripts/upload/app-store-connect.sh
            artifact-file: "Firezone.pkg"
            platform: macOS

          - job_name: build-macos-standalone
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            build-script: scripts/build/macos-standalone.sh
            upload-script: scripts/upload/github-release.sh
            # mark:next-apple-version
            artifact-file: "firezone-macos-client-1.5.20.dmg"
            # mark:next-apple-version
            pkg-artifact-file: "firezone-macos-client-1.5.20.pkg"
            # mark:next-apple-version
            release-name: apple-client-1.5.20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true # Otherwise we cannot embed the correct version into the build.
      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd swift/apple swiftlint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-rust-stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      - run: ${{ matrix.build-script }}
        env:
          IOS_APP_PROVISIONING_PROFILE: "${{ secrets.APPLE_IOS_APP_PROVISIONING_PROFILE }}"
          IOS_NE_PROVISIONING_PROFILE: "${{ secrets.APPLE_IOS_NE_PROVISIONING_PROFILE }}"
          MACOS_APP_PROVISIONING_PROFILE: "${{ secrets.APPLE_MACOS_APP_PROVISIONING_PROFILE }}"
          MACOS_NE_PROVISIONING_PROFILE: "${{ secrets.APPLE_MACOS_NE_PROVISIONING_PROFILE }}"
          STANDALONE_MACOS_APP_PROVISIONING_PROFILE: "${{ secrets.APPLE_STANDALONE_MACOS_APP_PROVISIONING_PROFILE }}"
          STANDALONE_MACOS_NE_PROVISIONING_PROFILE: "${{ secrets.APPLE_STANDALONE_MACOS_NE_PROVISIONING_PROFILE }}"
          BUILD_CERT: "${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}"
          BUILD_CERT_PASS: "${{ secrets.APPLE_BUILD_CERTIFICATE_P12_PASSWORD }}"
          INSTALLER_CERT: "${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE_BASE64 }}"
          INSTALLER_CERT_PASS: "${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE_P12_PASSWORD }}"
          STANDALONE_BUILD_CERT: "${{ secrets.APPLE_STANDALONE_BUILD_CERTIFICATE_BASE64 }}"
          STANDALONE_BUILD_CERT_PASS: "${{ secrets.APPLE_STANDALONE_BUILD_CERTIFICATE_P12_PASSWORD }}"
          STANDALONE_INSTALLER_CERT: "${{ secrets.APPLE_STANDALONE_MAC_INSTALLER_CERTIFICATE_BASE64 }}"
          STANDALONE_INSTALLER_CERT_PASS: "${{ secrets.APPLE_STANDALONE_MAC_INSTALLER_CERTIFICATE_P12_PASSWORD }}"
          ARTIFACT_PATH: "${{ runner.temp }}/${{ matrix.artifact-file }}"
          PKG_ARTIFACT_PATH: "${{ runner.temp }}/${{ matrix.pkg-artifact-file }}"
          NOTARIZE: "${{ github.event_name == 'workflow_dispatch' }}"
          ISSUER_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}"
          API_KEY_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY_ID }}"
          API_KEY: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY }}"
          TEMP_DIR: "${{ runner.temp }}"
      - name: Upload .dmg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "${{ github.event_name == 'workflow_dispatch' && matrix.job_name == 'build-macos-standalone' }}"
        with:
          name: macos-client-standalone-dmg
          path: "${{ runner.temp }}/${{ matrix.artifact-file }}"
      - name: Upload .pkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "${{ github.event_name == 'workflow_dispatch' && matrix.job_name == 'build-macos-standalone' }}"
        with:
          name: macos-client-standalone-pkg
          path: "${{ runner.temp }}/${{ matrix.pkg-artifact-file }}"
      - run: ${{ matrix.upload-script }}
        if: "${{ github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || matrix.job_name != 'build-macos-standalone') }}"
        env:
          ARTIFACT_PATH: "${{ runner.temp }}/${{ matrix.artifact-file }}"
          ISSUER_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}"
          API_KEY_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY_ID }}"
          API_KEY: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RELEASE_NAME: "${{ matrix.release-name }}"
          PLATFORM: "${{ matrix.platform }}"
      # We also publish a pkg file for MDMs that don't like our DMG (Intune error 0x87D30139)
      - run: ${{ matrix.upload-script }}
        if: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && matrix.job_name == 'build-macos-standalone' }}"
        env:
          ARTIFACT_PATH: "${{ runner.temp }}/${{ matrix.pkg-artifact-file }}"
          ISSUER_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}"
          API_KEY_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY_ID }}"
          API_KEY: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RELEASE_NAME: "${{ matrix.release-name }}"
          PLATFORM: "${{ matrix.platform }}"
      # The App Store IPA is also attached to the release so admins can verify the exact binary we shipped.
      - name: Upload .ipa to the GitHub release
        run: scripts/upload/github-release.sh
        if: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && matrix.job_name == 'build-ios' }}"
        env:
          ARTIFACT_PATH: "${{ runner.temp }}/${{ matrix.artifact-file }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RELEASE_NAME: "${{ matrix.release-name }}"
      - name: Setup sentry CLI
        if: "${{ github.event_name == 'workflow_dispatch' }}"
        uses: matbour/setup-sentry-cli@3e938c54b3018bdd019973689ef984e033b0454b #v2.0.0
        with:
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          organization: firezone-inc
      - name: Upload debug symbols to Sentry
        if: "${{ github.event_name == 'workflow_dispatch' }}"
        run: |
          # Remove the /Applications symlink in the DMG staging directory so Sentry doesn't
          # attempt to walk it.
          rm -f "${{ runner.temp }}/dmg/Applications"

          sentry-cli debug-files upload --log-level info --project apple-client --include-sources ${{ runner.temp }}
          sentry-cli debug-files upload --log-level info --project apple-client --include-sources ./rust/target
