name: Build macOS/iOS app
on:
  workflow_call:
    inputs:
      prepare_store:
        description: Prepare the App Store drafts from this branch
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      prepare_store:
        description: Prepare the App Store drafts from this branch
        type: boolean
        default: false

jobs:
  update-release-draft:
    name: update-release-draft
    runs-on: ubuntu-24.04
    outputs:
      build_number: ${{ steps.release-metadata.outputs.build_number }}
      version: ${{ steps.release-metadata.outputs.version }}
    permissions:
      contents: write # release-drafter needs to create/update releases
    env:
      # mark:next-apple-version
      RELEASE_NAME: apple-client-1.5.20
    steps:
      - name: Set release metadata
        id: release-metadata
        run: |
          echo "build_number=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_NAME#apple-client-}" >> "$GITHUB_OUTPUT"
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        if: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' }}"
        id: update-release-draft
        with:
          config-name: release-drafter-apple-client.yml
          tag: ${{ env.RELEASE_NAME}}
          version: ${{ env.RELEASE_NAME}}
          name: ${{ env.RELEASE_NAME}}
          commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: macos-26
    permissions:
      security-events: write # trivy SARIF upload from setup-mise
    env:
      XCODE_VERSION: "26.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch "$(find /Applications -maxdepth 1 -name "Xcode*${XCODE_VERSION}*.app" | sort -V | tail -n 1)"
      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd swift/apple swiftlint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run //swift/apple:test-coverage
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        env:
          # The macOS runner installs the reporter from the coverallsapp/coveralls
          # Homebrew tap, which Homebrew 6.0.0 refuses to load unless trusted.
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: swift/apple/FirezoneKit/coverage.lcov
          flag-name: swift-test
          parallel: true
          fail-on-error: false

  # Photographs the real app against the mocked backend (see MockTunnel.swift) and
  # hands the captures to commit-screenshots. Nothing is compared against a reference.
  # SwiftUI lays a window out with the macOS release it runs on rather than the
  # SDK it was built with, so the macOS screens are drawn on every release CI can run.
  screenshots-macos:
    name: macos-${{ matrix.release }}-screenshots
    runs-on: macos-${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: [26, 15]
    env:
      XCODE_VERSION: "26.2"
      # GIT_SHA stays unset: the settings screens print it as their build
      # string, and the commit would move two images on every push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch "$(find /Applications -maxdepth 1 -name "Xcode*${XCODE_VERSION}*.app" | sort -V | tail -n 1)"
      - uses: ./.github/actions/setup-mise
        with:
          install: false
      - uses: ./.github/actions/setup-rust-stable
        with:
          targets: aarch64-apple-darwin
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      # GPU blend rounding differs between Apple chip generations, so a pixel wobble
      # can be traced to the chip that drew it.
      - name: Name the hardware under the VM
        run: |
          sw_vers -productVersion
          sysctl -n hw.model machdep.cpu.brand_string
          system_profiler SPDisplaysDataType | grep -E "Chipset|Model|Metal" || true
      # The wallpaper shows through the window corners, and macOS shifts it over the day.
      - name: Pin what is behind the windows
        run: |
          defaults -currentHost write com.apple.screensaver idleTime -int 0

          osascript -e "tell application \"System Events\" to tell every desktop \
            to set picture to \"${GITHUB_WORKSPACE}/swift/apple/FirezoneUITests/Resources/screenshot-backdrop.png\"" \
            || echo "::warning::Could not set the desktop picture; the window corners stay at the mercy of the wallpaper"
      - uses: ./.github/actions/restore-xcode-build
        id: xcode-build
        with:
          path: ${{ runner.temp }}/DerivedData
          key: macos-${{ matrix.release }}
      - name: Photograph the macOS screens
        # The runner context only exists at step level.
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
          RESULT_BUNDLE_DIR: ${{ runner.temp }}
        run: mise run //swift/apple:screenshots-macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.release }}-screenshots
          path: swift/apple/screenshots/macos/${{ matrix.release }}
      # Only `main` writes, so a pull request cannot evict what every run reads.
      # `success()` is spelled out because naming a condition replaces the
      # implicit one.
      - uses: ./.github/actions/save-xcode-build
        if: success() && github.ref_name == 'main' && steps.xcode-build.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/DerivedData
          key: ${{ steps.xcode-build.outputs.key }}
      # The result bundles hold XCUITest's own failure screenshots and logs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: macos-${{ matrix.release }}-screenshots-xcresult
          path: ${{ runner.temp }}/FirezoneUITests-*.xcresult

  # The app target embeds the tunnel extension, which compiles connlib, and the
  # same simulator build runs on every device. So the iOS suite is built once here
  # and photographed on each simulator in parallel below.
  build-ios-screenshots:
    name: ios-screenshots-build
    runs-on: macos-26
    env:
      XCODE_VERSION: "26.2"
      # GIT_SHA stays unset: the settings screens print it as their build
      # string, and the commit would move two images on every push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch "$(find /Applications -maxdepth 1 -name "Xcode*${XCODE_VERSION}*.app" | sort -V | tail -n 1)"
      - uses: ./.github/actions/setup-mise
        with:
          install: false
      - uses: ./.github/actions/setup-rust-stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      - uses: ./.github/actions/restore-xcode-build
        id: xcode-build
        with:
          path: ${{ runner.temp }}/DerivedData
          key: ios
      - name: Build the iOS screenshot suite
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
        run: mise run //swift/apple:build-screenshots-ios
      # Packed because the artifact store drops the executable bits the app and
      # the test runner need.
      - name: Pack the test products
        run: tar -C "${RUNNER_TEMP}/DerivedData/Build" -cf "${RUNNER_TEMP}/ios-screenshots-build.tar" Products
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-screenshots-build
          path: ${{ runner.temp }}/ios-screenshots-build.tar
          retention-days: 1
      - uses: ./.github/actions/save-xcode-build
        if: success() && github.ref_name == 'main' && steps.xcode-build.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/DerivedData
          key: ${{ steps.xcode-build.outputs.key }}

  screenshots-ios:
    name: ios-${{ matrix.device }}-screenshots
    needs: build-ios-screenshots
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iphone
            simulator: iPhone 17 Pro Max
          - device: ipad
            simulator: iPad Pro 13-inch (M5)
    env:
      XCODE_VERSION: "26.2"
      SIMULATOR_NAME: ${{ matrix.simulator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch "$(find /Applications -maxdepth 1 -name "Xcode*${XCODE_VERSION}*.app" | sort -V | tail -n 1)"
      - uses: ./.github/actions/setup-mise
        with:
          install: false
      - name: Name the hardware under the VM
        run: |
          sw_vers -productVersion
          sysctl -n hw.model machdep.cpu.brand_string
          system_profiler SPDisplaysDataType | grep -E "Chipset|Model|Metal" || true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-screenshots-build
          path: ${{ runner.temp }}
      - name: Unpack the test products
        run: |
          mkdir -p "${RUNNER_TEMP}/DerivedData/Build"
          tar -C "${RUNNER_TEMP}/DerivedData/Build" -xf "${RUNNER_TEMP}/ios-screenshots-build.tar"
      - name: Boot the simulator
        run: mise run //swift/apple:boot-simulator
      - name: Photograph the ${{ matrix.device }} screens
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
          RESULT_BUNDLE_DIR: ${{ runner.temp }}
        run: mise run //swift/apple:screenshots-ios
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-${{ matrix.device }}-screenshots
          path: swift/apple/screenshots/ios/${{ matrix.device }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ios-${{ matrix.device }}-screenshots-xcresult
          path: ${{ runner.temp }}/FirezoneUITests-*.xcresult

  static-analysis:
    runs-on: macos-26
    permissions:
      security-events: write # trivy SARIF upload from setup-mise
    env:
      XCODE_VERSION: "26.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch "$(find /Applications -maxdepth 1 -name "Xcode*${XCODE_VERSION}*.app" | sort -V | tail -n 1)"
      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd swift/apple swiftlint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Swift formatting and linting
        run: mise run //swift/apple:check

  build:
    name: ${{ matrix.job_name }}
    # Skip builds on CD (push to main) - only needed for PR validation and releases
    if: github.event_name != 'push'
    needs: update-release-draft
    runs-on: macos-26
    env:
      XCODE_VERSION: "26.2"
    permissions:
      contents: write # for attaching the build artifacts to the release
      id-token: write # OIDC auth
      security-events: write # trivy SARIF upload from setup-mise
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        include:
          - job_name: build-ios
            rust-targets: aarch64-apple-ios
            build-script: scripts/build/ios-appstore.sh
            upload-script: scripts/upload/app-store-connect.sh
            # mark:next-apple-version
            artifact-file: "firezone-ios-client-1.5.20.ipa"
            platform: iOS
            # mark:next-apple-version
            release-name: apple-client-1.5.20

          - job_name: build-macos-appstore
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            build-script: scripts/build/macos-appstore.sh
            upload-script: scripts/upload/app-store-connect.sh
            artifact-file: "Firezone.pkg"
            platform: macOS

          - job_name: build-macos-standalone
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            build-script: scripts/build/macos-standalone.sh
            upload-script: scripts/upload/github-release.sh
            # mark:next-apple-version
            artifact-file: "firezone-macos-client-1.5.20.dmg"
            # mark:next-apple-version
            pkg-artifact-file: "firezone-macos-client-1.5.20.pkg"
            # mark:next-apple-version
            release-name: apple-client-1.5.20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true # Otherwise we cannot embed the correct version into the build.
      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd swift/apple swiftlint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-rust-stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      - run: ${{ matrix.build-script }}
        env:
          IOS_APP_PROVISIONING_PROFILE: "${{ secrets.APPLE_IOS_APP_PROVISIONING_PROFILE }}"
          IOS_NE_PROVISIONING_PROFILE: "${{ secrets.APPLE_IOS_NE_PROVISIONING_PROFILE }}"
          MACOS_APP_PROVISIONING_PROFILE: "${{ secrets.APPLE_MACOS_APP_PROVISIONING_PROFILE }}"
          MACOS_NE_PROVISIONING_PROFILE: "${{ secrets.APPLE_MACOS_NE_PROVISIONING_PROFILE }}"
          STANDALONE_MACOS_APP_PROVISIONING_PROFILE: "${{ secrets.APPLE_STANDALONE_MACOS_APP_PROVISIONING_PROFILE }}"
          STANDALONE_MACOS_NE_PROVISIONING_PROFILE: "${{ secrets.APPLE_STANDALONE_MACOS_NE_PROVISIONING_PROFILE }}"
          BUILD_CERT: "${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}"
          BUILD_CERT_PASS: "${{ secrets.APPLE_BUILD_CERTIFICATE_P12_PASSWORD }}"
          INSTALLER_CERT: "${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE_BASE64 }}"
          INSTALLER_CERT_PASS: "${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE_P12_PASSWORD }}"
          STANDALONE_BUILD_CERT: "${{ secrets.APPLE_STANDALONE_BUILD_CERTIFICATE_BASE64 }}"
          STANDALONE_BUILD_CERT_PASS: "${{ secrets.APPLE_STANDALONE_BUILD_CERTIFICATE_P12_PASSWORD }}"
          STANDALONE_INSTALLER_CERT: "${{ secrets.APPLE_STANDALONE_MAC_INSTALLER_CERTIFICATE_BASE64 }}"
          STANDALONE_INSTALLER_CERT_PASS: "${{ secrets.APPLE_STANDALONE_MAC_INSTALLER_CERTIFICATE_P12_PASSWORD }}"
          ARTIFACT_PATH: "${{ runner.temp }}/${{ matrix.artifact-file }}"
          PKG_ARTIFACT_PATH: "${{ runner.temp }}/${{ matrix.pkg-artifact-file }}"
          NOTARIZE: "${{ github.event_name == 'workflow_dispatch' }}"
          FIREZONE_NO_TELEMETRY: "${{ github.event_name != 'workflow_dispatch' }}"
          BUILD_NUMBER: "${{ needs.update-release-draft.outputs.build_number }}"
          ISSUER_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}"
          API_KEY_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY_ID }}"
          API_KEY: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY }}"
          TEMP_DIR: "${{ runner.temp }}"
      - name: Upload .dmg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "${{ github.event_name == 'workflow_dispatch' && matrix.job_name == 'build-macos-standalone' }}"
        with:
          name: macos-client-standalone-dmg
          path: "${{ runner.temp }}/${{ matrix.artifact-file }}"
      - name: Upload .pkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "${{ github.event_name == 'workflow_dispatch' && matrix.job_name == 'build-macos-standalone' }}"
        with:
          name: macos-client-standalone-pkg
          path: "${{ runner.temp }}/${{ matrix.pkg-artifact-file }}"
      - run: ${{ matrix.upload-script }}
        if: "${{ github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || matrix.job_name != 'build-macos-standalone') }}"
        env:
          ARTIFACT_PATH: "${{ runner.temp }}/${{ matrix.artifact-file }}"
          ISSUER_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}"
          API_KEY_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY_ID }}"
          API_KEY: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RELEASE_NAME: "${{ matrix.release-name }}"
          PLATFORM: "${{ matrix.platform }}"
      # We also publish a pkg file for MDMs that don't like our DMG (Intune error 0x87D30139)
      - run: ${{ matrix.upload-script }}
        if: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && matrix.job_name == 'build-macos-standalone' }}"
        env:
          ARTIFACT_PATH: "${{ runner.temp }}/${{ matrix.pkg-artifact-file }}"
          ISSUER_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}"
          API_KEY_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY_ID }}"
          API_KEY: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RELEASE_NAME: "${{ matrix.release-name }}"
          PLATFORM: "${{ matrix.platform }}"
      # The App Store IPA is also attached to the release so admins can verify the exact binary we shipped.
      - name: Upload .ipa to the GitHub release
        run: scripts/upload/github-release.sh
        if: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && matrix.job_name == 'build-ios' }}"
        env:
          ARTIFACT_PATH: "${{ runner.temp }}/${{ matrix.artifact-file }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RELEASE_NAME: "${{ matrix.release-name }}"
      - name: Setup sentry CLI
        if: "${{ github.event_name == 'workflow_dispatch' }}"
        uses: matbour/setup-sentry-cli@ff4fff773f5e628fa214ebd19e46fb7289454ee2 #v3.0.0
        with:
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          organization: firezone-inc
      - name: Upload debug symbols to Sentry
        if: "${{ github.event_name == 'workflow_dispatch' }}"
        run: |
          # Remove the /Applications symlink in the DMG staging directory so Sentry doesn't
          # attempt to walk it.
          rm -f "${{ runner.temp }}/dmg/Applications"

          sentry-cli debug-files upload --log-level info --project apple-client --include-sources ${{ runner.temp }}
          sentry-cli debug-files upload --log-level info --project apple-client --include-sources ./rust/target

  prepare-app-store:
    name: prepare-app-store
    if: "${{ github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || inputs.prepare_store) }}"
    needs: [update-release-draft, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # trivy SARIF upload from setup-mise
    env:
      ASC_APP_ID: "6443661826"
      ASC_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY }}
      BUILD_NUMBER: ${{ needs.update-release-draft.outputs.build_number }}
      VERSION: ${{ needs.update-release-draft.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd swift/apple github:rorkai/App-Store-Connect-CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage App Store inputs
        run: |
          metadata_dir="${RUNNER_TEMP}/app-store-metadata/versions/${VERSION}"
          iphone_dir="${RUNNER_TEMP}/app-store-screenshots/ios/iphone/en-US"
          ipad_dir="${RUNNER_TEMP}/app-store-screenshots/ios/ipad/en-US"
          macos_dir="${RUNNER_TEMP}/app-store-screenshots/macos/en-US"
          mkdir -p "$metadata_dir" "$iphone_dir" "$ipad_dir" "$macos_dir"

          cp swift/apple/app-store/metadata/en-US.json "$metadata_dir/en-US.json"

          cp swift/apple/screenshots/ios/iphone/welcome-light.png "$iphone_dir/01-welcome.png"
          cp swift/apple/screenshots/ios/iphone/session-light.png "$iphone_dir/02-session.png"
          cp swift/apple/screenshots/ios/iphone/session-scrolled-light.png "$iphone_dir/03-session-scrolled.png"
          cp swift/apple/screenshots/ios/iphone/session-menu-light.png "$iphone_dir/04-session-menu.png"
          cp swift/apple/screenshots/ios/iphone/resource-details-light.png "$iphone_dir/05-resource-details.png"
          cp swift/apple/screenshots/ios/iphone/resource-details-internet-light.png "$iphone_dir/06-internet-resource.png"
          cp swift/apple/screenshots/ios/iphone/device-details-light.png "$iphone_dir/07-device-details.png"
          cp swift/apple/screenshots/ios/iphone/settings-general-light.png "$iphone_dir/08-settings-general.png"
          cp swift/apple/screenshots/ios/iphone/settings-advanced-light.png "$iphone_dir/09-settings-advanced.png"
          cp swift/apple/screenshots/ios/iphone/x509-filled-light.png "$iphone_dir/10-x509.png"

          cp swift/apple/screenshots/ios/ipad/welcome-light.png "$ipad_dir/01-welcome.png"
          cp swift/apple/screenshots/ios/ipad/session-light.png "$ipad_dir/02-session.png"
          cp swift/apple/screenshots/ios/ipad/session-scrolled-light.png "$ipad_dir/03-session-scrolled.png"
          cp swift/apple/screenshots/ios/ipad/session-menu-light.png "$ipad_dir/04-session-menu.png"
          cp swift/apple/screenshots/ios/ipad/resource-details-light.png "$ipad_dir/05-resource-details.png"
          cp swift/apple/screenshots/ios/ipad/resource-details-internet-light.png "$ipad_dir/06-internet-resource.png"
          cp swift/apple/screenshots/ios/ipad/device-details-light.png "$ipad_dir/07-device-details.png"
          cp swift/apple/screenshots/ios/ipad/settings-general-light.png "$ipad_dir/08-settings-general.png"
          cp swift/apple/screenshots/ios/ipad/settings-advanced-light.png "$ipad_dir/09-settings-advanced.png"
          cp swift/apple/screenshots/ios/ipad/x509-filled-light.png "$ipad_dir/10-x509.png"

          cp swift/apple/screenshots/macos/26/first-time-light.png "$macos_dir/01-first-time-light.png"
          cp swift/apple/screenshots/macos/26/first-time-dark.png "$macos_dir/02-first-time-dark.png"
          cp swift/apple/screenshots/macos/26/settings-general-light.png "$macos_dir/03-settings-general-light.png"
          cp swift/apple/screenshots/macos/26/settings-general-dark.png "$macos_dir/04-settings-general-dark.png"
          cp swift/apple/screenshots/macos/26/settings-advanced-light.png "$macos_dir/05-settings-advanced-light.png"
          cp swift/apple/screenshots/macos/26/settings-advanced-dark.png "$macos_dir/06-settings-advanced-dark.png"
          cp swift/apple/screenshots/macos/26/x509-filled-light.png "$macos_dir/07-x509-light.png"
          cp swift/apple/screenshots/macos/26/x509-filled-dark.png "$macos_dir/08-x509-dark.png"
          cp swift/apple/screenshots/macos/26/grant-vpn-light.png "$macos_dir/09-grant-vpn-light.png"
          cp swift/apple/screenshots/macos/26/grant-vpn-dark.png "$macos_dir/10-grant-vpn-dark.png"

          echo "METADATA_DIR=${RUNNER_TEMP}/app-store-metadata" >> "$GITHUB_ENV"
          echo "IPHONE_SCREENSHOTS=${RUNNER_TEMP}/app-store-screenshots/ios/iphone" >> "$GITHUB_ENV"
          echo "IPAD_SCREENSHOTS=${RUNNER_TEMP}/app-store-screenshots/ios/ipad" >> "$GITHUB_ENV"
          echo "MACOS_SCREENSHOTS=${RUNNER_TEMP}/app-store-screenshots/macos" >> "$GITHUB_ENV"
      - name: Wait for the iOS build
        run: |
          result=$(asc builds wait \
            --app "$ASC_APP_ID" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform IOS \
            --fail-on-invalid \
            --output json)
          echo "$result"
          echo "IOS_BUILD_ID=$(jq -er '.buildId' <<< "$result")" >> "$GITHUB_ENV"
      - name: Wait for the macOS build
        run: |
          result=$(asc builds wait \
            --app "$ASC_APP_ID" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform MAC_OS \
            --fail-on-invalid \
            --output json)
          echo "$result"
          echo "MACOS_BUILD_ID=$(jq -er '.buildId' <<< "$result")" >> "$GITHUB_ENV"
      - name: Find iOS App Store version
        id: ios-version
        env:
          PLATFORM: IOS
        run: |
          target=$(asc versions list --app "$ASC_APP_ID" --version "$VERSION" --platform "$PLATFORM" --output json)
          count=$(jq -er '.data | length' <<< "$target")
          if [[ "$count" == 1 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$count" != 0 ]]; then
            echo "Expected at most one iOS App Store version ${VERSION}, found ${count}" >&2
            exit 1
          fi
          source=$(asc versions list --app "$ASC_APP_ID" --platform "$PLATFORM" --limit 200 --output json \
            | jq -er --arg version "$VERSION" '[.data[] | select(.attributes.versionString != $version)] | sort_by(.attributes.createdDate) | last | .attributes.versionString')
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - name: Find macOS App Store version
        id: macos-version
        env:
          PLATFORM: MAC_OS
        run: |
          target=$(asc versions list --app "$ASC_APP_ID" --version "$VERSION" --platform "$PLATFORM" --output json)
          count=$(jq -er '.data | length' <<< "$target")
          if [[ "$count" == 1 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$count" != 0 ]]; then
            echo "Expected at most one macOS App Store version ${VERSION}, found ${count}" >&2
            exit 1
          fi
          source=$(asc versions list --app "$ASC_APP_ID" --platform "$PLATFORM" --limit 200 --output json \
            | jq -er --arg version "$VERSION" '[.data[] | select(.attributes.versionString != $version)] | sort_by(.attributes.createdDate) | last | .attributes.versionString')
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - name: Create the iOS App Store version
        if: steps.ios-version.outputs.exists == 'false'
        run: >-
          asc versions create
          --app "$ASC_APP_ID"
          --version "$VERSION"
          --platform IOS
          --release-type MANUAL
          --copy-metadata-from "${{ steps.ios-version.outputs.source }}"
      - name: Create the macOS App Store version
        if: steps.macos-version.outputs.exists == 'false'
        run: >-
          asc versions create
          --app "$ASC_APP_ID"
          --version "$VERSION"
          --platform MAC_OS
          --release-type MANUAL
          --copy-metadata-from "${{ steps.macos-version.outputs.source }}"
      - name: Keep the App Store releases manual
        run: |
          for platform in IOS MAC_OS; do
            version_id=$(asc versions list \
              --app "$ASC_APP_ID" \
              --version "$VERSION" \
              --platform "$platform" \
              --output json \
              | jq -er 'if (.data | length) == 1 then .data[0].id else error("expected one version") end')
            asc versions update --version-id "$version_id" --release-type MANUAL
          done
      - name: Set What's New on iOS
        run: asc metadata push --app "$ASC_APP_ID" --version "$VERSION" --platform IOS --dir "$METADATA_DIR"
      - name: Set What's New on macOS
        run: asc metadata push --app "$ASC_APP_ID" --version "$VERSION" --platform MAC_OS --dir "$METADATA_DIR"
      - name: Replace iPhone screenshots
        run: >-
          asc screenshots upload
          --app "$ASC_APP_ID"
          --version "$VERSION"
          --platform IOS
          --path "$IPHONE_SCREENSHOTS"
          --device-type APP_IPHONE_67
          --replace
      - name: Replace iPad screenshots
        run: >-
          asc screenshots upload
          --app "$ASC_APP_ID"
          --version "$VERSION"
          --platform IOS
          --path "$IPAD_SCREENSHOTS"
          --device-type APP_IPAD_PRO_3GEN_129
          --replace
      - name: Replace macOS screenshots
        run: >-
          asc screenshots upload
          --app "$ASC_APP_ID"
          --version "$VERSION"
          --platform MAC_OS
          --path "$MACOS_SCREENSHOTS"
          --device-type APP_DESKTOP
          --replace
      - name: Stage the iOS App Store release
        run: >-
          asc release stage
          --app "$ASC_APP_ID"
          --version "$VERSION"
          --build "$IOS_BUILD_ID"
          --platform IOS
          --metadata-dir "$METADATA_DIR"
          --confirm
      - name: Stage the macOS App Store release
        run: >-
          asc release stage
          --app "$ASC_APP_ID"
          --version "$VERSION"
          --build "$MACOS_BUILD_ID"
          --platform MAC_OS
          --metadata-dir "$METADATA_DIR"
          --confirm
