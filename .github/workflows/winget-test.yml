name: Test winget manifests
on:
  push:
    branches:
      - ci/firezone-ci-app

permissions:
  contents: read

jobs:
  delete-test-branches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: firezone
          repositories: winget-pkgs
          permission-contents: write
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for branch in Firezone.Client.GUI-1.5.20 Firezone.Client.Headless-1.5.15; do
            gh api -X DELETE "repos/firezone/winget-pkgs/git/refs/heads/$branch" || true
          done

  output-probe:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd rust/gui-client github:russellbanks/Komac
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          NO_COLOR: "1"
        run: |
          set -x
          ls -laR /c/.mise-installs/github-russellbanks-komac || true
          mise --cd rust/gui-client which komac
          mise --cd rust/gui-client exec -- komac --version
          mise --cd rust/gui-client exec -- komac update Firezone.Client.GUI --version 1.5.20 \
            --urls https://github.com/firezone/firezone/releases/download/gui-client-1.5.20/firezone-client-gui-windows_1.5.20_x86_64.msi \
            --dry-run --output "$RUNNER_TEMP/out" > "$RUNNER_TEMP/stdout.txt" || echo "exit $?"
          grep -n "Latest version\|Successfully\|written" "$RUNNER_TEMP/stdout.txt" || true
          ls -laR "$RUNNER_TEMP/out" || echo "nothing written to --output"
          mise --cd rust/gui-client exec -- komac update Firezone.Client.GUI --version 1.5.20 \
            --urls https://github.com/firezone/firezone/releases/download/gui-client-1.5.20/firezone-client-gui-windows_1.5.20_x86_64.msi \
            --skip-pr-check --output "$RUNNER_TEMP/out2" < /dev/null > "$RUNNER_TEMP/stdout2.txt" || echo "exit $?"
          grep -n "Latest version\|Successfully\|written\|What would" "$RUNNER_TEMP/stdout2.txt" || true
          ls -laR "$RUNNER_TEMP/out2" || echo "nothing written to --output without --dry-run"

  winget:
    needs: delete-test-branches
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        release:
          - gui-client-1.5.20
          - headless-client-1.5.15
    uses: ./.github/workflows/_winget.yml
    secrets:
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
    with:
      release_name: ${{ matrix.release }}
      release_tag: ${{ matrix.release }}
