---
name: Fuzz corpora (nightly)
run-name: Triggered from ${{ github.event_name }} on ${{ github.ref_name }}
# Grows and minimizes every committed fuzz corpus, refreshing the
# uncovered-region ceilings alongside. The scheduled run works on main and
# proposes each target's result as its own bot PR; dispatching the workflow on
# any other branch pushes the result back to that branch instead, e.g. to
# re-grow the corpus for a PR that changes the harness. A dispatch can also
# narrow the run to a single target. Pull-request CI only replays committed
# inputs; coverage discovery happens here.
"on":
  schedule:
    - cron: "0 4 * * *" # daily, 04:00 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "A single fuzz target to work on, e.g. 'tunnel-proto'. Leave empty for every target in rust/tests/fuzz/targets.json."
        required: false
        type: string
        default: ""

defaults:
  run:
    working-directory: ./rust

permissions:
  contents: read

concurrency:
  # Per ref, so a branch dispatch and the scheduled run on main cannot cancel
  # each other.
  group: fuzz-nightly-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  targets:
    name: fuzz-targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: targets
        env:
          # Empty for the schedule, which cannot pass inputs.
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          read -r requested _ <<<"$REQUESTED_TARGET"

          if [[ -z "$requested" ]]; then
            echo "targets=$(jq -c . tests/fuzz/targets.json)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "targets=$(jq -nc --arg target "$requested" '[$target]')" >> "$GITHUB_OUTPUT"

  discover:
    name: discover-${{ matrix.fuzz-target }}
    needs: [targets]
    strategy:
      fail-fast: false
      matrix:
        fuzz-target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    # No job-level budget: the phases below carry their own, and a job that runs
    # out of time is cancelled, discarding what the phases that did finish found.
    permissions:
      contents: read
      pull-requests: read # to find this target's open corpus PR
      security-events: write # trivy SARIF upload from setup-mise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-sccache
      # cargo-afl compiles its bundled runtime during mise installation.
      - name: Install fuzzing toolchain
        run: |
          RUSTUP_TOOLCHAIN="$(sed -n 's/^RUSTUP_TOOLCHAIN = "\(.*\)"/\1/p' tests/fuzz/mise.toml)"
          export RUSTUP_TOOLCHAIN
          bash tests/fuzz/mise-tasks/install-toolchain.sh
      - name: Cache AFL++ tools and runtime
        id: afl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/afl.rs
          key: afl-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/tests/fuzz/mise.toml', 'rust/tests/fuzz/mise.lock') }}
      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd rust/tests/fuzz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The mise cache can contain cargo-afl without its separately cached runtime.
      - name: Populate AFL++ cache
        if: steps.afl-cache.outputs.cache-hit != 'true'
        run: mise --cd tests/fuzz install --force cargo:cargo-afl
      - uses: ./.github/actions/free-disk-space
      # A corpus PR that has not been reviewed yet still holds the discoveries
      # of every night since it was opened. Growing what the default branch
      # carries would rediscover them from scratch, and the push below would
      # then overwrite the only copy.
      - name: Seed from the open corpus pull request
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.fuzz-target }}
        run: |
          set -euo pipefail

          branch="chore/fuzz-corpora-$TARGET"

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "No open corpus pull request for $TARGET; growing what $GITHUB_REF_NAME carries."
            exit 0
          fi

          git fetch --depth 1 origin "$branch"

          # Both, rather than the branch alone: it was grown from an earlier
          # default branch and has no way of carrying what landed there since.
          mise run //rust/tests/fuzz:unpack-corpus "$TARGET"
          git show "FETCH_HEAD:rust/tests/fuzz/corpora/$TARGET.tar.gz" >"$RUNNER_TEMP/$TARGET.tar.gz"
          mise run //rust/tests/fuzz:unpack-corpus "$TARGET" "$RUNNER_TEMP/$TARGET.tar.gz"
      # The phases `grow` runs locally, one step each: each carries its own
      # budget and each runs whatever the one before it did, so neither an
      # overrun nor a failure costs the night what the other phases found.
      # This runner is disposable. Bypass Ubuntu's crash-reporting pipe so AFL
      # receives crashing children promptly instead of classifying them as hangs.
      - name: Configure crash reporting for AFL++
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Fuzz for new coverage
        timeout-minutes: 45
        run: mise run //rust/tests/fuzz:fuzz ${{ matrix.fuzz-target }} --workers "$(nproc)" --seconds 1800
      - name: Minimize the corpus
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: mise run //rust/tests/fuzz:cmin ${{ matrix.fuzz-target }}
      - name: Measure coverage
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: mise run //rust/tests/fuzz:coverage ${{ matrix.fuzz-target }}
      - name: Refresh the uncovered-region ceiling
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: mise run //rust/tests/fuzz:update-baseline ${{ matrix.fuzz-target }}
      # After the measurement: these inputs crash the target by definition, so a
      # `coverage` run that included them could not produce a profile and the
      # ceiling would go unrefreshed for the night.
      - name: Keep the failing inputs
        if: ${{ !cancelled() }}
        run: mise run //rust/tests/fuzz:save-crashes ${{ matrix.fuzz-target }}
      - name: Pack the corpus
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: mise run //rust/tests/fuzz:pack-corpus ${{ matrix.fuzz-target }}
      - name: Save corpus and coverage baseline
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.fuzz-target }}
          path: |
            rust/tests/fuzz/corpora/${{ matrix.fuzz-target }}.tar.gz
            rust/tests/fuzz/expected-coverage/${{ matrix.fuzz-target }}.json
          if-no-files-found: error

  propose:
    name: propose-${{ matrix.fuzz-target }}
    needs: [targets, discover]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      # One at a time: every job in this matrix pushes, and on a dispatched
      # branch they all push to the same ref.
      max-parallel: 1
      matrix:
        fuzz-target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fuzz-${{ matrix.fuzz-target }}
          path: rust/tests/fuzz
      - name: Set up GnuPG for the corpus commit
        uses: ./.github/actions/setup-gpg
        id: setup-gpg
        with:
          key: ${{ secrets.RELEASE_PR_BOT_GPG_KEY }}
          email: github-bot@firezone.dev
      - name: Push corpus update
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_BOT_GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET: ${{ matrix.fuzz-target }}
        run: |
          set -euo pipefail

          git config --local user.email "github-bot@firezone.dev"
          git config --local user.name "Firezone Bot"
          git config --local user.signingkey "${{ steps.setup-gpg.outputs.key_id }}"
          git config --local commit.gpgsign true

          git add -A "tests/fuzz/corpora/$TARGET.tar.gz" "tests/fuzz/expected-coverage/$TARGET.json"
          if git diff --cached --quiet; then
            echo "The $TARGET corpus is unchanged; nothing to push."
            exit 0
          fi
          git commit -m "chore(fuzz): grow the $TARGET corpus"

          # Do not use checkout's GITHUB_TOKEN for the push: pushes made with
          # it do not trigger the pull request's workflows.
          git config --local http.https://github.com/.extraheader ""
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ "$REF" != "$DEFAULT_BRANCH" ]; then
            # The dispatching branch may have moved while the fuzz jobs ran, so
            # replay the update onto its tip rather than overwriting it.
            git fetch origin "$REF"
            git rebase "origin/$REF"
            git push origin "HEAD:$REF"
            exit 0
          fi

          # A branch per target, so a corpus that carries a crashing input only
          # holds up its own review.
          branch="chore/fuzz-corpora-$TARGET"
          git checkout -B "$branch"
          git push -u origin HEAD --force

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "chore(fuzz): grow the $TARGET corpus" \
              --body "The nightly fuzz job discovered new coverage for \`$TARGET\` and refreshed its uncovered-region ceiling." \
              --reviewer firezone/engineering
          fi
