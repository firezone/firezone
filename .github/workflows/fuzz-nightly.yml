---
name: Fuzz corpora (nightly)
run-name: Triggered from ${{ github.event_name }} on ${{ github.ref_name }}
# Adds to every committed fuzz corpus the inputs that reach edges it does not.
# The scheduled run works on main and proposes each target's result as its own
# bot PR; dispatching the workflow on any other branch pushes the result back
# to that branch instead, e.g. to re-grow the corpus for a PR that changes the
# harness. A dispatch can also narrow the run to a single target. Pull-request
# CI only replays committed inputs; coverage discovery happens here.
"on":
  schedule:
    - cron: "0 4 * * *" # daily, 04:00 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "A single fuzz target to work on, e.g. 'tunnel-proto'. Leave empty for every target in rust/tests/fuzz/targets.json."
        required: false
        type: string
        default: ""

defaults:
  run:
    working-directory: ./rust

permissions:
  contents: read

concurrency:
  # Per ref, so a branch dispatch and the scheduled run on main cannot cancel
  # each other.
  group: fuzz-nightly-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  targets:
    name: fuzz-targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: targets
        env:
          # Empty for the schedule, which cannot pass inputs.
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          read -r requested _ <<<"$REQUESTED_TARGET"

          if [[ -z "$requested" ]]; then
            echo "targets=$(jq -c . tests/fuzz/targets.json)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "targets=$(jq -nc --arg target "$requested" '[$target]')" >> "$GITHUB_OUTPUT"

  discover:
    name: discover-${{ matrix.fuzz-target }}
    needs: [targets]
    strategy:
      fail-fast: false
      matrix:
        fuzz-target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    # No job-level budget: the phases below carry their own, and a job that runs
    # out of time is cancelled, discarding what the phases that did finish found.
    env:
      # Match pull-request builds so they share compiler-cache entries.
      RUSTFLAGS: "--deny warnings"
    permissions:
      contents: read
      pull-requests: read # to find this target's open corpus PR
      security-events: write # trivy SARIF upload from setup-mise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust-sccache
        with:
          azure-connection-string: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
      - uses: ./.github/actions/setup-mise
        with:
          install_args: --cd rust/tests/fuzz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-afl
      - uses: ./.github/actions/free-disk-space
      # A corpus PR that has not been reviewed yet still holds the discoveries
      # of every night since it was opened. Growing what the default branch
      # carries would rediscover them from scratch, and the push below would
      # then overwrite the only copy.
      - name: Seed from the open corpus pull request
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.fuzz-target }}
        run: |
          set -euo pipefail

          branch="chore/fuzz-corpora-$TARGET"

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "No open corpus pull request for $TARGET; growing what $GITHUB_REF_NAME carries."
            exit 0
          fi

          git fetch --depth 1 origin "$branch"

          # The union with what the checkout carries, rather than the branch
          # alone: it was grown from an earlier default branch and has no way
          # of carrying what landed there since. A path checkout adds and
          # overwrites but never deletes.
          git checkout FETCH_HEAD -- "tests/fuzz/corpus/$TARGET"
      # The phases `grow` runs locally, one step each: each carries its own
      # budget and each runs whatever the one before it did, so neither an
      # overrun nor a failure costs the night what the other phases found.
      # This runner is disposable. Bypass Ubuntu's crash-reporting pipe so AFL
      # receives crashing children promptly instead of classifying them as hangs.
      - name: Configure crash reporting for AFL++
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Fuzz for new coverage
        # AFL's time budget excludes corpus calibration. tunnel-proto's slow
        # executions stop its workers within their first queue cycle, so it
        # gets a longer budget.
        timeout-minutes: ${{ matrix.fuzz-target == 'tunnel-proto' && 150 || 60 }}
        env:
          FUZZ_SECONDS: ${{ matrix.fuzz-target == 'tunnel-proto' && 7200 || 1800 }}
        run: mise run //rust/tests/fuzz:fuzz ${{ matrix.fuzz-target }} --workers "$(nproc)" --seconds "$FUZZ_SECONDS"
      - name: Keep what reaches new edges
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: mise run //rust/tests/fuzz:select ${{ matrix.fuzz-target }}
      - name: Keep the failing inputs
        if: ${{ !cancelled() }}
        run: mise run //rust/tests/fuzz:save-crashes ${{ matrix.fuzz-target }}
      - name: Save the corpus
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.fuzz-target }}
          path: rust/tests/fuzz/corpus/${{ matrix.fuzz-target }}/
          if-no-files-found: error

  propose:
    name: propose-${{ matrix.fuzz-target }}
    needs: [targets, discover]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      # One at a time: every job in this matrix pushes, and on a dispatched
      # branch they all push to the same ref.
      max-parallel: 1
      matrix:
        fuzz-target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-${{ matrix.fuzz-target }}
          path: rust/tests/fuzz
      - uses: ./.github/actions/propose-fuzz-corpus
        with:
          target: ${{ matrix.fuzz-target }}
          branch-prefix: chore/fuzz-corpora-
          title: "chore(fuzz): grow the ${{ matrix.fuzz-target }} corpus"
          body: "The nightly fuzz job found inputs for `${{ matrix.fuzz-target }}` that reach edges the committed corpus did not."
          gpg-key: ${{ secrets.RELEASE_PR_BOT_GPG_KEY }}
          token: ${{ secrets.RELEASE_PR_BOT_GITHUB_TOKEN }}
